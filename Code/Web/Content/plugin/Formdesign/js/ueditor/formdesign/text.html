<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>文本框</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <link href="../../../../../../Content/Main.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="skt.uidesigner.style.css">
    <script type="text/javascript" src="../dialogs/internal.js"></script>
    <script type="text/javascript">
        /* Thank you by  
        http://www.alt-tag.com/blog/2006/02/ie-dom-bugs/ */
        function createElement(type, name) {
            var element = null;
            try {
                element = document.createElement('<' + type + ' name="' + name + '">');
            } catch (e) { }
            if (element == null) {
                element = document.createElement(type);
                element.name = name;
            }
            return element;
        }
    </script>
</head>
<body>
    <div class="infoTips">
        带<em>*</em>为必填项目</div>
    <table class="EditeContentTable" width="100%">
        <tr>
            <td class="Label2">
                控件名称<em>*</em>
            </td>
            <td class="Field2">
                <input type="text" id="uictrl_name" placeholder="必填项" class="TextBox" />
            </td>
            <td class="Label2">
                默认值
            </td>
            <td class="Field2">
                <input type="text" id="uictrl_value" placeholder="无则不填" class="TextBox" />
            </td>
        </tr>
        <tr>
            <td class="Label2">
                数据类型
            </td>
            <td class="Field2">
                <select id="uictrl_datatype">
                    <option value="text">普通文本</option>
                    <option value="email">邮箱地址</option>
                    <option value="int">整数</option>
                    <option value="float">小数</option>
                    <option value="idcard">身份证号码</option>
                    <option value="datepicker">日期</option>
                </select>
            </td>
            <td class="Label2">
                对齐方式
            </td>
            <td class="Field2">
                <select id="uictrl_align">
                    <option value="left">左对齐</option>
                    <option value="center">居中对齐</option>
                    <option value="right">右对齐</option>
                </select>
            </td>
        </tr>
        <tr>
            <td class="Label2">
                长*宽
            </td>
            <td class="Field2">
                <input id="uictrl_width" type="text" value="150" class="TextBox" style="width: 35px;"
                    placeholder="auto" />px *
                <input id="uictrl_height" type="text" value="" class="TextBox" style="width: 35px;"
                    placeholder="auto" />px
            </td>
            <td class="Label2">
                字体大小
            </td>
            <td class="Field2">
                <input id="uictrl_fontsize" type="text" value="" class="TextBox" style="width: 35px;"
                    placeholder="auto" />px
            </td>
        </tr>
        <tr>
            <td class="Label2">
                可见性
            </td>
            <td class="Field2">
                <input id="uictrl_hide" type="checkbox" />
                隐藏
            </td>
            <td class="Label2">
                是否必填
            </td>
            <td class="Field2">
                <input id="uictrl_required" type="checkbox" />
                必填
            </td>
        </tr>
        <tr>
            <td class="Label2">
                正则表达式
            </td>
            <td class="Field2">
                <input type="text" id="uictrl_regexp" class="TextBox" style="width: 250px;" />
            </td>
            <td class="Label2">
                UI事件入口
            </td>
            <td class="Field2">
                <input type="checkbox" id="uictrl_isentry" />是
            </td>
        </tr>
    </table>
    <script type="text/javascript">
        var oNode = null, thePlugins = 'text';
        window.onload = function () {
            if (UE.plugins[thePlugins].editdom) {
                oNode = UE.plugins[thePlugins].editdom;
                var gValue = '';
                if (oNode.getAttribute('value'))
                    gValue = oNode.getAttribute('value').replace(/&quot;/g, "\"");
                var gTitle = oNode.getAttribute('title').replace(/&quot;/g, "\""), gHidden = oNode.getAttribute('uictrlhide'), gFontSize = oNode.getAttribute('uictrlfontsize'), gAlign = oNode.getAttribute('uictrlalign'), gWidth = oNode.getAttribute('uictrlwidth'), gHeight = oNode.getAttribute('uictrlheight'), gType = oNode.getAttribute('uictrldatatype'), gRequired = oNode.getAttribute('uictrlrequired'), gRegexp = oNode.getAttribute('uictrlregexp').replace(/&quot;/g, "\""), gIsEntry = oNode.getAttribute('uictrlisentry');
                gValue = gValue == null ? '' : gValue;
                gTitle = gTitle == null ? '' : gTitle;
                $G('uictrl_value').value = gValue;
                $G('uictrl_name').value = gTitle;
                if (gHidden == '1') {
                    $G('uictrl_hide').checked = true;
                }
                $G('uictrl_fontsize').value = gFontSize;
                $G('uictrl_width').value = ($getstyle(oNode)[0] == '') ? gWidth : $getstyle(oNode)[0];
                $G('uictrl_height').value = ($getstyle(oNode)[1] == '') ? gHeight : $getstyle(oNode)[1];
                $G('uictrl_align').value = gAlign;
                $G('uictrl_datatype').value = gType;
                /*Add By Alen Liu 2016-12-26*/
                if (gRequired == '1') {
                    $G('uictrl_required').checked = true;
                }
                $G('uictrl_regexp').value = gRegexp;
                if (gIsEntry == "1") {
                    $G('uictrl_isentry').checked = true;
                }
                else {
                    $G('uictrl_isentry').checked = false;
                }
            }
        }
        dialog.oncancel = function () {
            if (UE.plugins[thePlugins].editdom) {
                delete UE.plugins[thePlugins].editdom;
            }
        };
        dialog.onok = function () {
            if ($G('uictrl_name').value == '') {
                alert('请输入控件名称');
                $focus($G('uictrl_name'));
                return false;
            }
            var gValue = $G('uictrl_value').value.replace(/\"/g, "&quot;"), gTitle = $G('uictrl_name').value.replace(/\"/g, "&quot;"), gFontSize = $G('uictrl_fontsize').value, gAlign = $G('uictrl_align').value, gWidth = $G('uictrl_width').value, gHeight = $G('uictrl_height').value, gType = $G('uictrl_datatype').value, gRegexp = $G('uictrl_regexp').value.replace(/\"/g, "&quot;");

            if (!oNode) {//如果节点不存在说明是新创建的控件，需要生成ID
                try {
                    var ctrlId = $createid(thePlugins);
                    oNode = createElement('input', 'uictrl_NewField');
                    oNode.setAttribute('type', 'text');
                    oNode.setAttribute('title', gTitle);
                    oNode.setAttribute('value', gValue);
                    oNode.setAttribute('name', ctrlId);
                    if (gType == 'datepicker') {
                        oNode.setAttribute('class', 'DateTimeBox');
                    }
                    else {
                        oNode.setAttribute('class', 'TextBox');
                    }
                    oNode.setAttribute('uictrltype', thePlugins);
                    if ($G('uictrl_hide').checked) {
                        oNode.setAttribute('uictrlhide', 1);
                    } else {
                        oNode.setAttribute('uictrlhide', 0);
                    }
                    if (gFontSize != '') {
                        oNode.style.fontSize = gFontSize + 'px';
                        oNode.setAttribute('uictrlfontsize', gFontSize);
                    }
                    else {
                        oNode.setAttribute('uictrlfontsize', 'auto');
                    }
                    if (gAlign != '') {
                        oNode.style.textAlign = gAlign;
                        oNode.setAttribute('uictrlalign', gAlign);
                    }

                    if (gWidth != '') {
                        oNode.style.width = gWidth + 'px';
                        oNode.setAttribute('uictrlwidth', gWidth);
                    }
                    else {
                        oNode.setAttribute('uictrlwidth', 'auto');
                    }
                    if (gHeight != '') {
                        oNode.style.height = gHeight + 'px';
                        oNode.setAttribute('uictrlheight', gHeight);
                    }
                    else {
                        oNode.setAttribute('uictrlheight', 'auto');
                    }
                    if (gType != '') {
                        oNode.setAttribute('uictrldatatype', gType);
                    }
                    /*Add By Alen Liu 2016-12-26*/
                    if ($G('uictrl_required').checked) {
                        oNode.setAttribute('uictrlrequired', 1);
                    }
                    else {
                        oNode.setAttribute('uictrlrequired', 0);
                    }
                    oNode.setAttribute('uictrlregexp', gRegexp);
                    oNode.setAttribute('id', ctrlId);
                    //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                    if ($G('uictrl_isentry').checked) {
                        oNode.setAttribute('onchange', 'loadPage(this)');
                        oNode.setAttribute('uictrlisentry', '1');
                    }
                    else {
                        oNode.removeAttribute('onchange');
                        oNode.setAttribute('uictrlisentry', '0');
                    }
                    editor.execCommand('insertHtml', oNode.outerHTML);
                } catch (e) {
                    try {
                        editor.execCommand('error');
                    } catch (e) {
                        alert('控件异常！');
                    }
                    return false;
                }
            } else {
                //对于编辑状态下的控件，更新时不需要更新ID
                oNode.setAttribute('title', gTitle);
                oNode.setAttribute('value', $G('uictrl_value').value);
                if ($G('uictrl_hide').checked) {
                    oNode.setAttribute('uictrlhide', 1);
                } else {
                    oNode.setAttribute('uictrlhide', 0);
                }
                if (gFontSize != '') {
                    oNode.style.fontSize = gFontSize + 'px';
                    oNode.setAttribute('uictrlfontsize', gFontSize);
                } else {
                    oNode.style.fontSize = '';
                    oNode.setAttribute('uictrlfontsize', '');
                }
                if (gAlign != '') {
                    oNode.style.textAlign = gAlign;
                    oNode.setAttribute('uictrlalign', gAlign);
                } else {
                    oNode.setAttribute('uictrlalign', '');
                }
                if (gWidth != '') {
                    oNode.style.width = gWidth + 'px';
                    oNode.setAttribute('uictrlwidth', gWidth);
                } else {
                    oNode.style.width = '';
                    oNode.setAttribute('uictrlwidth', '');
                }
                if (gHeight != '') {
                    oNode.style.height = gHeight + 'px';
                    oNode.setAttribute('uictrlheight', gHeight);
                } else {
                    oNode.style.height = '';
                    oNode.setAttribute('uictrlheight', '');
                }
                if (gType != '') {
                    oNode.setAttribute('uictrldatatype', gType);
                } else {
                    oNode.setAttribute('uictrldatatype', '');
                }
                /*Add By Alen Liu 2016-12-26*/
                if ($G('uictrl_required').checked) {
                    oNode.setAttribute('uictrlrequired', 1);
                }
                else {
                    oNode.setAttribute('uictrlrequired', 0);
                }
                oNode.setAttribute('uictrlregexp', gRegexp);
                //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                if ($G('uictrl_isentry').checked) {
                    oNode.setAttribute('onchange', 'loadPage(this)');
                    oNode.setAttribute('uictrlisentry', '1');
                }
                else {
                    oNode.removeAttribute('onchange');
                    oNode.setAttribute('uictrlisentry', '0');
                }
                delete UE.plugins[thePlugins].editdom;
            }
        };
    </script>
</body>
</html>
