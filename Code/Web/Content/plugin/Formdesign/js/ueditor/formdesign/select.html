    <script type="text/javascript">
        function createElement(type, name) {
            var element = null;
            try {
                element = document.createElement('<' + type + ' name="' + name + '">');
            } catch (e) { }
            if (element == null) {
                element = document.createElement(type);
                element.name = name;
            }
            return element;
        }
        function fnSelect(combo) {
            var iIndex = combo.selectedIndex;
            oListText.selectedIndex = iIndex;
            var olistText = document.getElementById("uictrl_text");
            olistText.value = oListText.value;
        }

        function fnAdd() {
            var olistText = document.getElementById("uictrl_text");
            fnAddComboOption(oListText, olistText.value, olistText.value);
            oListText.selectedIndex = oListText.options.length - 1;
            olistText.value = '';
            olistText.focus();
        }

        function fnModify() {
            var iIndex = oListText.selectedIndex;
            if (iIndex < 0) return;
            var olistText = document.getElementById("uictrl_text");
            oListText.options[iIndex].innerHTML = fnHTMLEncode(olistText.value);
            oListText.options[iIndex].value = olistText.value;
            olistText.value = '';
            olistText.focus();
        }

        function fnMove(steps) {
            fnChangeOptionPosition(oListText, steps);
        }

        function fnDelete() {
            fnRemoveSelectedOptions(oListText);
        }

        function fnSetSelectedValue() {
            var iIndex = oListText.selectedIndex;
            if (iIndex < 0) return;
            var olistText = document.getElementById("uictrl_value");
            olistText.innerHTML = oListText.options[iIndex].value;
        }

        // Moves the selected option by a number of steps (also negative)
        function fnChangeOptionPosition(combo, steps) {
            var iActualIndex = combo.selectedIndex;
            if (iActualIndex < 0) {
                return;
            }
            var iFinalIndex = iActualIndex + steps;
            if (iFinalIndex < 0) {
                iFinalIndex = 0;
            }
            if (iFinalIndex > (combo.options.length - 1)) {
                iFinalIndex = combo.options.length - 1;
            }
            if (iActualIndex == iFinalIndex) {
                return;
            }
            var oOption = combo.options[iActualIndex];
            if (oOption.value == "") {
                var sText = fnHTMLDecode(oOption.value);
            } else {
                var sText = fnHTMLDecode(oOption.innerHTML);
            }
            combo.remove(iActualIndex);
            oOption = fnAddComboOption(combo, sText, sText, null, iFinalIndex);
            oOption.selected = true;
        }

        // Remove all selected options from a SELECT object
        function fnRemoveSelectedOptions(combo) {
            // Save the selected index
            var iSelectedIndex = combo.selectedIndex;
            var oOptions = combo.options;
            // Remove all selected options
            for (var i = oOptions.length - 1; i >= 0; i--) {
                if (oOptions[i].selected) combo.remove(i);
            }

            // Reset the selection based on the original selected index
            if (combo.options.length > 0) {
                if (iSelectedIndex >= combo.options.length) iSelectedIndex = combo.options.length - 1;
                combo.selectedIndex = iSelectedIndex;
            }
        }

        // Add a new option to a SELECT object (combo or list)
        function fnAddComboOption(combo, optionText, optionValue, documentObject, index) {
            var oOption;
            if (documentObject) {
                oOption = documentObject.createElement("option");
            } else {
                oOption = document.createElement("option");
            }
            if (index != null) {
                combo.options.add(oOption, index);
            } else {
                combo.options.add(oOption);
            }
            oOption.innerHTML = optionText.length > 0 ? fnHTMLEncode(optionText) : '&nbsp;';
            oOption.value = optionValue;
            return oOption;
        }

        function fnHTMLEncode(text) {
            if (!text) {
                return '';
            }
            text = text.replace(/&/g, '&amp;');
            text = text.replace(/</g, '&lt;');
            text = text.replace(/>/g, '&gt;');
            return text;
        }


        function fnHTMLDecode(text) {
            if (!text) {
                return '';
            }
            text = text.replace(/&gt;/g, '>');
            text = text.replace(/&lt;/g, '<');
            text = text.replace(/&amp;/g, '&');
            return text;
        }

        function fnSetAttribute(element, attName, attValue) {
            if (attValue == null || attValue.length == 0) {
                element.removeAttribute(attName, 0);
            } else {
                element.setAttribute(attName, attValue, 0);
            }
        }
    </script>

            <td class="Label2">
                设置

                    <a title="新增" onclick="fnAdd();" class="btn btn-primary"><i class="icon-white icon-plus">
                    </i></a><a title="修改" onclick="fnModify();" class="btn btn-default"><i class="icon-edit">
                    </i></a>

                    rel="popover" data-original-title="说明"><i class="icon-info-sign"></i></a>

    <div class="clear5">
    </div>
    <script type="text/javascript">
        var oNode = null, oListText = '', thePlugins = 'select';
        window.onload = function () {
            oListText = $G('uictrl_list');

            if (UE.plugins[thePlugins].editdom) {
                oNode = UE.plugins[thePlugins].editdom;
                var gTitle = oNode.getAttribute('title').replace(/&quot;/g, "\""), gWidth = oNode.getAttribute('uictrlwidth'), gSize = oNode.getAttribute('size'), gIsEntry = oNode.getAttribute('uictrlisentry');
                gTitle = gTitle == null ? '' : gTitle;
                $G('uictrl_value').innerHTML = oNode.value;
                $G('uictrl_name').value = gTitle;
                $G('uictrl_size').value = gSize;
                $G('uictrl_width').value = gWidth;
                if (gIsEntry == "1") {
                    $G('uictrl_isentry').checked = true;
                }
                else {
                    $G('uictrl_isentry').checked = false;
                }
                for (var i = 0; i < oNode.options.length; i++) {
                    var sText = oNode.options[i].value;
                    fnAddComboOption(oListText, sText, sText);
                }
            }
            /*$('#showTips').popover();*/
        }
        dialog.oncancel = function () {
            if (UE.plugins[thePlugins].editdom) {
                delete UE.plugins[thePlugins].editdom;
            }
        };
        dialog.onok = function () {
            if ($G('uictrl_name').value == '') {
                alert('控件名称不能为空');
                $focus($G('uictrl_name'));
                return false;
            }
            if (oListText.options.length == 0) {
                alert('请添加下拉菜单选项！');
                return false;
            }
            var gSize = $G('uictrl_size').value;
            if (gSize == null || isNaN(gSize) || gSize < 1) {
                gSize = '';
            }
            var gWidth = $G('uictrl_width').value;

            if (!oNode) {
                try {
                    var ctrlId = $createid(thePlugins);
                    //oNode = document.createElement("select"); 
                    oNode = createElement('select', 'uictrl_NewField');
                    oNode.setAttribute('title', $G('uictrl_name').value);
                    oNode.setAttribute('uictrltype', thePlugins);
                    oNode.setAttribute('size', gSize);
                    oNode.setAttribute('id', ctrlId);
                    oNode.setAttribute('name', ctrlId);
                    oNode.setAttribute('uictrldatasource', '');
                    oNode.setAttribute('uictrldatasourcetype', '');
                    if ($G('uictrl_width').value != '') {
                        oNode.style.width = $G('uictrl_width').value + 'px';
                        //oNode.setAttribute('style','width:'+ $G('uictrl_width').value + 'px;');
                    }
                    if (gWidth != '') {
                        oNode.style.width = gWidth + 'px';
                        oNode.setAttribute('uictrlwidth', gWidth);
                    }

                    //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                    if ($G('uictrl_isentry').checked) {
                        oNode.setAttribute('onchange', 'loadPage(this)');
                        oNode.setAttribute('uictrlisentry', '1');
                    }
                    else {
                        oNode.removeAttribute('onchange');
                        oNode.setAttribute('uictrlisentry', '0');
                    }
                    // Add all available options.
                    for (var i = 0; i < oListText.options.length; i++) {
                        var sText = oListText.options[i].value;
                        if (sText.length == 0) {
                            sText = sText;
                        }
                        var oOption = fnAddComboOption(oNode, sText, sText);
                        if (sText == $G('uictrl_value').innerHTML) {
                            fnSetAttribute(oOption, 'selected', 'selected');
                            oOption.selected = true;
                        }
                    }
                    //firefox要利用span
                    editor.execCommand('insertHtml', '{|-<span uictrltype="select">' + oNode.outerHTML + '&nbsp;&nbsp;</span>-|}');
                    return true;
                } catch (e) {
                    try {
                        editor.execCommand('error');
                    } catch (e) {
                        alert('控件异常！');
                    }
                    return false;
                }
            } else {
                oNode.setAttribute('title', $G('uictrl_name').value);
                oNode.setAttribute('size', gSize);
                if (gWidth != '') {
                    oNode.style.width = gWidth + 'px';
                    oNode.setAttribute('uictrlwidth', gWidth);
                }
                //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                if ($G('uictrl_isentry').checked) {
                    oNode.setAttribute('onchange', 'loadPage(this)');
                    oNode.setAttribute('uictrlisentry', '1');
                }
                else {
                    oNode.removeAttribute('onchange');
                    oNode.setAttribute('uictrlisentry', '0');
                }
                // Remove all options.
                while (oNode.options.length > 0) {
                    oNode.remove(0);
                }
                for (var i = 0; i < $G('uictrl_list').options.length; i++) {
                    var sText = $G('uictrl_list').options[i].value;
                    if (sText.length == 0) {
                        sText = sText;
                    }
                    var oOption = fnAddComboOption(oNode, sText, sText);
                    if (sText == $G('uictrl_value').innerHTML) {
                        fnSetAttribute(oOption, 'selected', 'selected');
                        oOption.selected = true;
                    }
                }
                delete UE.plugins[thePlugins].editdom;
            }
        };
    </script>
