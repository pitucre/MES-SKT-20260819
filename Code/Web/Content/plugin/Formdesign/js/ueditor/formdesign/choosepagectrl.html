<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>弹窗控件</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <link href="../../../../../../Content/Main.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="skt.uidesigner.style.css">
    <script type="text/javascript" src="../dialogs/internal.js"></script>
    <script type="text/javascript">
        function createElement(type, name) {
            var element = null;
            try {
                element = document.createElement('<' + type + ' name="' + name + '">');
            } catch (e) { }
            if (element == null) {
                element = document.createElement(type);
                element.name = name;
            }
            return element;
        }
    </script>
</head>
<body>
    <div class="infoTips">
        带<em>*</em>为必填项目</div>
    <table class="EditeContentTable" width="100%">
        <tr>
            <td class="Label2">
                控件名称<em>*</em>
            </td>
            <td class="Field2">
                <input type="text" id="uictrl_name" placeholder="必填项" class="TextBox" />
            </td>
            <td class="Label2">
                长
            </td>
            <td class="Field2">
                <input id="uictrl_width" type="text" value="150" class="TextBox" style="width: 35px;"
                    placeholder="auto" />px
            </td>
        </tr>
        <tr>
            <td class="Label2">
                是否只读
            </td>
            <td class="Field2">
                <input id="uictrl_readonly" type="checkbox" value="" class="CheckBox" />
            </td>
            <td class="Label2">
                字体大小
            </td>
            <td class="Field2">
                <input id="uictrl_fontsize" type="text" value="" class="TextBox" style="width: 35px;"
                    placeholder="auto" />
                px
            </td>
        </tr>
        <tr>
            <td class="Label2">
                UI事件入口
            </td>
            <td class="Field2" colspan="3">
                <input type="checkbox" id="uictrl_isentry" />是
            </td>
        </tr>
    </table>
    <script type="text/javascript">
        var oNode = null, thePlugins = 'choosepagectrl';
        window.onload = function () {
            if (UE.plugins[thePlugins].editdom) {
                oNode = UE.plugins[thePlugins].editdom;
                var gTitle = oNode.getAttribute('title').replace(/&quot;/g, "\""), gFontSize = oNode.getAttribute('uictrlfontsize'), gWidth = oNode.getAttribute('uictrlwidth'), gReadonly = oNode.getAttribute('uictrlreadonly'), gIsEntry = oNode.children[0].getAttribute('uictrlisentry');
                gTitle = gTitle == null ? '' : gTitle;
                $G('uictrl_name').value = gTitle;
                if (gReadonly == '1') {
                    $G('uictrl_readonly').checked = true;
                }
                $G('uictrl_name').value = gTitle;
                $G('uictrl_width').value = gWidth;
                $G('uictrl_fontsize').value = gFontSize;
                if (gIsEntry == "1") {
                    $G('uictrl_isentry').checked = true;
                }
                else {
                    $G('uictrl_isentry').checked = false;
                }
            }
        }

        dialog.oncancel = function () {
            if (UE.plugins[thePlugins].editdom) {
                delete UE.plugins[thePlugins].editdom;
            }
        };
        dialog.onok = function () {
            if ($G('uictrl_name').value == '') {
                alert('控件名称不能为空');
                $focus($G('uictrl_name'));
                return false;
            } 
            var gTitle = $G('uictrl_name').value.replace(/\"/g, "&quot;"), gFontSize = $G('uictrl_fontsize').value, gWidth = $G('uictrl_width').value, gReadonly = $G('uictrl_readonly').value;
            if (!oNode) {
                try {

                    //{|- 使用边界，防止用户删除了span标签
                    var ctrlId = $createid(thePlugins);
                    var html = '{|-<span style="padding:5px;" uictrltype="' + thePlugins + '" title="' + gTitle + '" name="' + ctrlId + '" id="' + ctrlId + '" uictrlreadonly="' + gReadonly + '" uictrlwidth="' + gWidth + '" uictrlfontsize="' + gFontSize + '">';
                    html += '<input type="text" name="' + ctrlId + '_textbox" value="" id="' + ctrlId + '_textbox" class="TextBox" uictrltype="' + thePlugins + '" style="';
                    if (gWidth != '') {
                        html += 'width:' + gWidth.toString() + 'px;';
                    }
                    if (gFontSize != '') {
                        html += 'font-size:' + gFontSize + 'px;';
                    }
                    html += '"';
                    if ($G('uictrl_readonly').checked) {
                        html += ' disabled = "disabled" ';
                    }
                    //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                    if ($G('uictrl_isentry').checked) {
                        html += ' onchange = "loadPage(this)" uictrlisentry = "1" ';
                    }
                    else {
                        html += ' uictrlisentry = "1" ';
                    }
                    html += '/><input type="button" value="..." id="' + ctrlId + '_button" title="' + gTitle + '" class="ButtonBox"/>';
                    html += '<input type="hidden" value="" id="' + ctrlId + '_hidden"/>';
                    html += '</span>-|}';
                    editor.execCommand('insertHtml', html);
                    return true;
                } catch (e) {
                    try {
                        editor.execCommand('error');
                    } catch (e) {
                        alert('控件异常！');
                    }
                    return false;
                }
            } else {
                //修改
                var childNodes = oNode.children;
                oNode.setAttribute('title', gTitle);
                childNodes[0].setAttribute('title', gTitle);
                childNodes[0].setAttribute('uictrltype', thePlugins);
                childNodes[1].setAttribute('title', gTitle);
                oNode.setAttribute('uictrlfontsize', gFontSize);
                childNodes[0].style.fontSize = gFontSize + 'px';
                oNode.setAttribute('uictrlwidth', gWidth);
                childNodes[0].style.width = gWidth + 'px';
                if ($G('uictrl_readonly').checked) {
                    oNode.setAttribute('uictrlreadonly', '1');
                    childNodes[0].setAttribute('disabled', 'disabled');
                }
                else {
                    oNode.setAttribute('uictrlreadonly', '0');
                    childNodes[0].removeAttribute('disabled');
                }
                //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                if ($G('uictrl_isentry').checked) {
                    childNodes[0].setAttribute('onchange', 'loadPage(this)');
                    childNodes[0].setAttribute('uictrlisentry', '1');
                }
                else {
                    childNodes[0].removeAttribute('onchange');
                    childNodes[0].setAttribute('uictrlisentry', '0');
                }

                delete UE.plugins[thePlugins].editdom;
                return true;
            }
        };
    </script>
</body>
</html>
