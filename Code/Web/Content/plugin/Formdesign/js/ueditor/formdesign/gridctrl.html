    <script type="text/javascript">
        function createElement(type, name) {
            var element = null;
            try {
                element = document.createElement('<' + type + ' name="' + name + '">');
            } catch (e) { }
            if (element == null) {
                element = document.createElement(type);
                element.name = name;
            }
            return element;
        }
    </script>

    <script type="text/javascript">
        var oNode = null, thePlugins = 'gridctrl';
        var rows_count = 8;
        var adefaultDatatype = ['label', 'date', 'int'];

        window.onload = function () {
            //弹出窗口初始化函数，这里主要是判断是编辑下拉列表还是新增
            if (UE.plugins[thePlugins].editdom) {
                oNode = UE.plugins[thePlugins].editdom;
                $G('uictrl_name').value = oNode.getAttribute('title');
                var gWidth = oNode.getAttribute('uictrlwidth');
                var gTitle = oNode.getAttribute('uictrltitle'), gColType = oNode.getAttribute('uictrlcoltype'), gListTableTitle = oNode.getAttribute('uictrllisttitle');
                var aTitle = gTitle.split('`');
                aColType = gColType ? gColType.split('`') : null;
                $G('uictrl_width').value = gWidth;
                $G('uictrl_listtitle').value = gListTableTitle;

                for (var i = 0; i < aTitle.length - 1; i++) {
                    var sItem = 'item_' + (i + 1),
                        sColtype = 'coltype_' + (i + 1);
                    $G(sItem).value = aTitle[i];
                    if (gColType) {
                        $('#' + sColtype).val(aColType[i]);
                    }
                }
            }
        };
        dialog.oncancel = function () {
            if (UE.plugins[thePlugins].editdom) {
                delete UE.plugins[thePlugins].editdom;
            }
        };
        //保存表格属性设置
        dialog.onok = function () {
            var gName = $G('uictrl_name').value.replace(/\"/g, "&quot;"), gWidth = $G('uictrl_width').value, gListTableTitle = $G('uictrl_listtitle').value;
            if (gName == '') {
                alert('控件名称不能为空');
                $focus($G('uictrl_name'));
                return false;
            }

            var gTitle = '', gColType = '', nCount = 0;
            for (var i = 1; i <= rows_count; i++) {
                var oItem = $G("item_" + i), oColType = $G('coltype_' + i);
                if (oItem.value != '') {
                    if (gTitle.indexOf(oItem.value + '`') !== -1) {
                        continue; //重复
                    }
                    gTitle += oItem.value + '`'; //表头
                    nCount++;
                    gColType += oColType.value + '`';
                } //end if
            } //end for

            if (nCount == 0) {
                alert("表头项目不能为空");
                return false;
            }

            if (!oNode) {
                try {
                    var ctrlId = $createid(thePlugins);
                    oNode = createElement('input', 'uictrl_NewField');
                    oNode.setAttribute('uictrltype', thePlugins);
                    oNode.setAttribute('type', 'text');
                    oNode.setAttribute('value', '{表格控件}');
                    oNode.setAttribute('readonly', 'readonly');
                    oNode.setAttribute('title', gName);
                    oNode.setAttribute('id', ctrlId);
                    oNode.setAttribute('name', ctrlId);
                    oNode.setAttribute('uictrltitle', gTitle);
                    oNode.setAttribute('uictrlcoltype', gColType);
                    oNode.setAttribute('uictrllisttitle', gListTableTitle);
                    oNode.setAttribute('uictrldatasourcetype', '');
                    oNode.setAttribute('uictrldatasource', '');

                    if (gWidth != '') {
                        oNode.style.width = gWidth;
                    }
                    oNode.setAttribute('uictrlwidth', gWidth);
                    editor.execCommand('insertHtml', oNode.outerHTML);
                    return true;
                } catch (e) {
                    try {
                        editor.execCommand('error');
                    } catch (e) {
                        alert('控件异常！');
                    }
                    return false;
                }
            } else {
                //修改
                oNode.setAttribute('uictrltype', thePlugins);
                oNode.setAttribute('title', gName);
                oNode.setAttribute('uictrltitle', gTitle);
                oNode.setAttribute('uictrlcoltype', gColType);
                oNode.setAttribute('uictrllisttitle', gListTableTitle);
                if (gWidth != '') {
                    oNode.style.width = gWidth;
                } else {
                    oNode.style.width = '';
                }
                oNode.setAttribute('uictrlwidth', gWidth);

                delete UE.plugins[thePlugins].editdom; //使用后清空这个对象，变回新增模式
            }
        };
    </script>
