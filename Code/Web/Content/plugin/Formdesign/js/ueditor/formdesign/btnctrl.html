<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>按钮控件</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <link href="../../../../../../Content/Main.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="skt.uidesigner.style.css">
    <script type="text/javascript" src="../dialogs/internal.js"></script>
    <script type="text/javascript">
        function createElement(type, name) {
            var element = null;
            try {
                element = document.createElement('<' + type + ' name="' + name + '">');
            } catch (e) { }
            if (element == null) {
                element = document.createElement(type);
                element.name = name;
            }
            return element;
        }
    </script>
</head>
<body>
    <div class="infoTips">
        带<em>*</em>为必填项目</div>
    <table class="EditeContentTable" width="100%">
        <tr>
            <td class="Label2">
                控件名称<em>*</em>
            </td>
            <td class="Field2">
                <input type="text" id="uictrl_name" placeholder="必填项" class="TextBox" />
            </td>
            <td class="Label2">
                长*宽
            </td>
            <td class="Field2">
                <input id="uictrl_width" type="text" value="150" class="TextBox" style="width: 35px;"
                    placeholder="auto" />px *
                <input id="uictrl_height" type="text" value="" class="TextBox" style="width: 35px;"
                    placeholder="auto" />px
            </td>
        </tr>
        <tr>
            <td class="Label2">
                按钮文本
            </td>
            <td class="Field2">
                <input id="uictrl_text" type="text" value="" class="TextBox" />
            </td>
            <td class="Label2">
                字体大小
            </td>
            <td class="Field2">
                <input id="uictrl_fontsize" type="text" value="" class="TextBox" style="width: 35px;"
                    placeholder="auto" />
                px
            </td>
        </tr>
        <tr>
            <td class="Label2">
                UI事件入口
            </td>
            <td class="Field2" colspan="3">
                <input type="checkbox" id="uictrl_isentry" />是
            </td>
        </tr>
    </table>
    <script type="text/javascript">
        var oNode = null, thePlugins = 'btnctrl';
        window.onload = function () {
            if (UE.plugins[thePlugins].editdom) {
                oNode = UE.plugins[thePlugins].editdom;
                var gTitle = oNode.getAttribute('title').replace(/&quot;/g, "\""), gFontSize = oNode.getAttribute('uictrlfontsize'), gWidth = oNode.getAttribute('uictrlwidth'), gHeight = oNode.getAttribute('uictrlheight'), gText = oNode.getAttribute('value').replace(/&quot;/g, "\""), 
                gIsEntry = oNode.getAttribute('uictrlisentry');
                gTitle = gTitle == null ? '' : gTitle;
                $G('uictrl_name').value = gTitle;
                $G('uictrl_name').value = gTitle;
                $G('uictrl_height').value = gHeight;
                $G('uictrl_width').value = gWidth;
                $G('uictrl_fontsize').value = gFontSize;
                $G('uictrl_text').value = gText;
                if (gIsEntry == "1") {
                    $G('uictrl_isentry').checked = true;
                }
                else {
                    $G('uictrl_isentry').checked = false;
                }
            }
        }

        dialog.oncancel = function () {
            if (UE.plugins[thePlugins].editdom) {
                delete UE.plugins[thePlugins].editdom;
            }
        };
        dialog.onok = function () {
            if ($G('uictrl_name').value == '') {
                alert('控件名称不能为空');
                $focus($G('uictrl_name'));
                return false;
            }
            var gTitle = $G('uictrl_name').value.replace(/\"/g, "&quot;"), gFontSize = $G('uictrl_fontsize').value, gWidth = $G('uictrl_width').value, gHeight = $G('uictrl_height').value, gText = $G('uictrl_text').value.replace(/\"/g, "&quot;");
            if (!oNode) {
                try {
                    var ctrlId = $createid(thePlugins);
                    oNode = createElement('input', 'uictrl_NewField');
                    oNode.setAttribute('type', 'button');
                    oNode.setAttribute('value', (gText == '' ? '按钮文本' : gText));
                    oNode.setAttribute('id', ctrlId);
                    oNode.setAttribute('title', gTitle);
                    oNode.setAttribute('name', ctrlId);
                    oNode.setAttribute('uictrltype', thePlugins);

                    if (gFontSize != '') {
                        oNode.style.fontSize = gFontSize + 'px';
                        oNode.setAttribute('uictrlfontsize', gFontSize);
                    }

                    if (gWidth != '') {
                        oNode.style.width = gWidth + 'px';
                        oNode.setAttribute('uictrlwidth', gWidth);
                    }
                    if (gHeight != '') {
                        oNode.style.height = gHeight + 'px';
                        oNode.setAttribute('uictrlheight', gHeight);
                    }
                    //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                    if ($G('uictrl_isentry').checked) {
                        oNode.setAttribute('onchange', 'loadPage(this)');
                        oNode.setAttribute('uictrlisentry', '1');
                    }
                    else {
                        oNode.removeAttribute('onchange');
                        oNode.setAttribute('uictrlisentry', '0');
                    }
                    editor.execCommand('insertHtml', oNode.outerHTML);
                    return true;
                } catch (e) {
                    try {
                        editor.execCommand('error');
                    } catch (e) {
                        alert('控件异常！');
                    }
                    return false;
                }
            } else {
                oNode.setAttribute('value', gText);
                oNode.setAttribute('title', gTitle);
                if (gFontSize != '') {
                    oNode.style.fontSize = gFontSize + 'px';
                    oNode.setAttribute('uictrlfontsize', gFontSize);
                } else {
                    oNode.setAttribute('uictrlfontsize', '');
                }
                if (gWidth != '') {
                    oNode.style.width = gWidth + 'px';
                    oNode.setAttribute('uictrlwidth', gWidth);
                } else {
                    oNode.setAttribute('uictrlwidth', '');
                }
                if (gHeight != '') {
                    oNode.style.height = gHeight + 'px';
                    oNode.setAttribute('uictrlheight', gHeight);
                }
                else {
                    oNode.setAttribute('uictrlheight', '');
                }
                //Add By Alen Liu 2017-01-04 增加UI事件入口控件设置
                if ($G('uictrl_isentry').checked) {
                    oNode.setAttribute('onchange', 'loadPage(this)');
                    oNode.setAttribute('uictrlisentry', '1');
                }
                else {
                    oNode.removeAttribute('onchange');
                    oNode.setAttribute('uictrlisentry', '0');
                }
                delete UE.plugins[thePlugins].editdom;
            }
        };
    </script>
    <script src="jquery-1.7.2.min.js" type="text/javascript"></script>
</body>
</html>
