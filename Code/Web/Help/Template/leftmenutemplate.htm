<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>left menu</title>
    <meta http-equiv="Content-Type" content="text/html;charset=gb2312" />
    <link rel="stylesheet" href="css/jquery.treeview.css" />
    <script src="script/jquery.min.js" type="text/javascript"></script>
    <script src="script/jquery.cookie.js" type="text/javascript"></script>
    <script src="script/jquery.treeview.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(document).ready(function () { $("#browser").treeview(); $("#helpTree").height($(window).height() - 40); $(window).keypress(function () { var event = arguments.callee.caller.arguments[0] || window.event; if (event.keyCode == 13) { search(); } }); });
    function setCurrentPath(str) {
        if (document.all) {
            window.parent.frames["toolbar"].document.getElementById("currentPath").innerHTML = str;
        }
        else {
            window.parent.document.getElementById("toolbar").contentDocument.getElementById("currentPath").innerHTML = str;
        }
    }

    function search() {
        if ($("#txtKey").val() != "") {
            $("#helpTree a").each(function () {
                if ($(this).attr("keyword").indexOf($("#txtKey").val())!=-1) {
                    window.location.hash = "#" + $(this).attr("id");
                    return false;
                }
            });
        }
    }
    </script>
    <style type="text/css">
    .search{ background:#ffffff url(css/search.png) 2px center no-repeat; border:1px solid #d3d3d3; padding:3px 3px 3px 20px;}
    .searchBtn{ cursor:pointer; width:24px; height:24px; position:absolute; top:4px; right:7px;}
    </style>
</head>
<body style="background: #ffffff; margin: 0px; padding: 0px;font-family:Verdana, Microsoft YaHei UI; font-size:12px;">
<div style=" padding:5px; border-bottom:1px solid #d3d3d3; background:#f7f7f7; min-width:180px; overflow:hidden; vertical-align:middle; position:relative;">搜索：<input type="text" id="txtKey" value="" style="width:100px;" class="search"/><span style="margin-top:3px;"><img src="css/searchbtn.png?s" alt="搜索" title="搜索" class="searchBtn" onclick="search()"/></span></div>
    <div style="clear:both;"></div>
    <div id="helpTree" style="overflow:auto;">
    {treeview}
    </div>
</body>
</html>
