<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>搜索</title>
    <script src="script/jquery.min.js" type="text/javascript"></script>
</head>
<body style="background: #eeeeee; margin: 0px; padding: 0px;font-family:Verdana, 微软雅黑,黑体, 宋体; font-size:12px;">
<div style=" margin:3px; position:relative; border-bottom:1px solid #DBDBDB">
    <div style=" position:absolute; top:1px;left:0px;"><input type="text" id="txtSearch" value="" style=" width:120px; height:18px;"/></div>
    <div style="position:absolute; top:1px; left:124px;"><input type="button" id="btnSearch" value="搜索" style=" width:50px; height:24px;"/></div>
</div>
<script type="text/javascript" language="javascript">
    $(function () {
        $("#btnSearch").click(function () {
            var field = $("#txtSearch").val();
            try {
                window.parent.frames["left"].search(field);
            }
            catch (e) {
                alert(e);
            }
        });
    });
</script>
</body>
</html>
