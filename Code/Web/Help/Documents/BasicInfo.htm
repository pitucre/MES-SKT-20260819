<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>基本信息</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">基本信息</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>序列号</td><td>工厂内部产生的产品序列号</td></tr><tr><td>工单号</td><td>工厂生产单号</td></tr><tr><td>型号</td><td>产品型号</td></tr><tr><td>版本</td><td>产品型号的版本号</td></tr><tr><td>箱号</td><td>成品装箱的箱号</td></tr><tr><td>工位</td><td>工厂生产线的操作工序</td></tr><tr><td>是否通过</td><td>产品在每个工位的操作结果</td></tr><tr><td>进入时间</td><td>进入工位的时间</td></tr><tr><td>离开时间</td><td>离开工位的时间</td></tr><tr><td>员工</td><td>操作的员工</td></tr><tr><td>资源</td><td>操作时用到的资源</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        通过条件查询出产品在实际生产过程中相关时候聚聚    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索</div><div class='clear10'></div><div class='list-detail'>1.输入查询条件，序列号、工单号、箱号、型号等；<br/>2.点击搜索按钮；<br/>3.结果显示在列表中。</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductChange/SNInfoQuery.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
