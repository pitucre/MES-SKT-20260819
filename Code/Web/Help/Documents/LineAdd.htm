<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>新增线别</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">新增线别</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>线别</td><td>生产线线别</td></tr><tr><td>描述</td><td>线别说明</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        增加新的线别、绑定相关资源    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页中单击新增按钮；<br/>2.输入线别相关信息；<br/>3.单击保存按钮</div><div class='clear10'></div><div class='list-img'><div><img src='images/ResourceMaintenance/LineListAdd.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>资源绑定与解除</div><div class='clear10'></div><div class='list-detail'>1.左边框中选择可分配的资源执行第2步的操作；<br/>2.单击中间按钮，资源将分配或解除给该线别；<br/>3.在右边框中选择已分配的资源执行第2步的操作；<br/>4.最后单击保存</div><div class='clear10'></div><div class='list-img'><div><img src='images/ResourceMaintenance/LineResourceBind.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
