<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>新增不良代码组</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">新增不良代码组</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>组名称</td><td>不良代码组名称</td></tr><tr><td>描述</td><td>不良代码描述</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        新增不良代码组    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>关联操作工位</div><div class='clear10'></div><div class='list-detail'>1.选择需要的操作工位进行关联。</div><div class='clear10'></div><div class='list-img'><div><img src='images/NCCode/NCGroupOperation.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中单击新增按钮；<br/>2.输入不良代码组描述，选择需要不良代码；<br/>3.单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/NCCode/NCGroupAdd.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
