<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>打印机设置列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">打印机设置列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>打印机名称</td><td>系统用到的镭射打印机</td></tr><tr><td>打印规则</td><td>镭射打印机的条码产生规则</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所有的打印机及其规则，可执行编辑、新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索打印机</div><div class='clear10'></div><div class='list-detail'>1.输入打印机名称关键字；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/SMT/PrinterSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增打印规则</div><div class='clear10'></div><div class='list-detail'>1.主页中单击新增按钮；<br/>2.输入打印机的MAC地址、打印规则字符串；<br/>3.单击保存按钮即可。</div><div class='clear10'></div><div class='list-img'><div><img src='images/SMT/PrinterAdd.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑打印规则</div><div class='clear10'></div><div class='list-detail'>1.主页中选择记录后单击编辑按钮；<br/>2.修改打印规则字符串；<br/>3.单击保存按钮即可。</div><div class='clear10'></div><div class='list-img'><div><img src='images/SMT/PrinterEdit.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除打印规则</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录；<br/>2.点击工具栏中的删除按钮：<br/>3.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/SMT/PrinterDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
