<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>SMT设备列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">SMT设备列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>序列号</td><td>设备序列号、设备工作台序列号、设备工作台位置序列号</td></tr><tr><td>设备名称 </td><td>设备名称</td></tr><tr><td>线别 </td><td>设备所在生产线</td></tr><tr><td>节点位置</td><td>节点位置</td></tr><tr><td>节点</td><td>节点</td></tr><tr><td>设备形状类型</td><td>设备类型:<br/>1.Table<br/>2.Tower<br/></td></tr><tr><td>状态</td><td>设备状态：<br/>1.Created          <br/>2.InActive   <br/>3.Deleted  <br/>4.Processing</td></tr><tr><td>描述 </td><td>设备描述；设备工作台描述、设备工作台位置描述</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所有的SMT设备，可执行新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>新增SMT设备</div><div class='clear10'></div><div class='list-detail'>增加新的SMT设备</div><div class='clear10'></div><div class='list-img'><div><img src='images/SMT/MachineToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除SMT设备</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录；<br/>2.点击工具栏中的删除按钮：<br/>3.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/SMT/MachineDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
