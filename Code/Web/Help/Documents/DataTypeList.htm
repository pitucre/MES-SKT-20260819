<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>数据类型列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">数据类型列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>数据类别</td><td>系统提供两种数据类别，Assembly：组装类别；NC：不良类别</td></tr><tr><td>数据类别名称</td><td>数据类别的一个具体实例名称</td></tr><tr><td>描述</td><td>定义该数据类别名称的用途</td></tr><tr><td>验证行为</td><td>所要关联的活动名称</td></tr><tr><td>备注</td><td>特别需要说明性的内容</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所有的数据类型名称，可执行编辑、新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索数据类别名称</div><div class='clear10'></div><div class='list-detail'>1.选择数据类别或输入数据数据类型名称关键字；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataTypeSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增数据类别名称</div><div class='clear10'></div><div class='list-detail'>增加新的数据类型名称</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataTypeToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑数据类别名称</div><div class='clear10'></div><div class='list-detail'>编辑存在的数据类型名称</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataTypeToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除数据类别名称</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录；<br/>2.点击工具栏中的删除按钮：<br/>3.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataTypeDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
