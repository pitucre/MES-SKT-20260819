<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>分配角色</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">分配角色</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>登录名</td><td>用来登录系统的账号，系统自动带出</td></tr><tr><td>工号</td><td>员工工号，系统自动带出</td></tr><tr><td>中文名</td><td>中文名称，系统自动带出</td></tr><tr><td>英文名</td><td>英文名称，系统自动带出</td></tr><tr><td>角色名</td><td>系统中存在的角色名称</td></tr><tr><td>描述</td><td>角色名的描述</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        对用户进行角色的分配    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>分配移除角色</div><div class='clear10'></div><div class='list-detail'>1.选择主页中相应的用户记录后单击工具栏中的角色分配按钮；<br/>2.在左边搜索出需要分配的角色并选中；<br/>3.单击"右移"按钮，完成系统对该用户的角色分配；<br/>4.在右边搜索出已分配的角色；<br/>5.单击"左移"按钮，完成系统对用户角色的移除</div><div class='clear10'></div><div class='list-img'><div><img src='images/UserManage/AssignUserToRole.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
