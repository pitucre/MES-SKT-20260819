<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>编辑标签字段</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">编辑标签字段</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>标签字段</td><td>标签字段名称</td></tr><tr><td>字段描述</td><td>字段相关描述</td></tr><tr><td>字段定义</td><td>字段定义函数、常量、数据库字段名</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        编辑存在标签字段    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>添加数据库字段</div><div class='clear10'></div><div class='list-detail'>在字段定义中添加需要数据库字段</div><div class='clear10'></div><div class='list-img'><div><img src='images/ZPL/LabelDBField.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>添加函数</div><div class='clear10'></div><div class='list-detail'>在字段定义中添加需要函数</div><div class='clear10'></div><div class='list-img'><div><img src='images/ZPL/LabelFx.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>添加常量</div><div class='clear10'></div><div class='list-detail'>在字段定义中添加需要常量</div><div class='clear10'></div><div class='list-img'><div><img src='images/ZPL/LabelLiteralString.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中单击编辑按钮；<br/>2.输入产品组信息；<br/>3.添加字段定义；删除或者移动存在字段定义<br/>4.单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/ZPL/LabelFieldEdit.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
