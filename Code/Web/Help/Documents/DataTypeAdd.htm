<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>添加数据类型</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">添加数据类型</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>数据类别</td><td>系统提供两种数据类别，Assembly：组装类别；NC：不良类别</td></tr><tr><td>数据类别名称</td><td>数据类别名称的实例名称</td></tr><tr><td>验证行为</td><td>关联系统中的活动名称</td></tr><tr><td>描述</td><td>对数据类别的详细解释</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        新增数据类型名称    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中单击新增按钮；<br/>2.选择类别后输入数据类别名称、验证行为和相关描述；<br/>3.单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataTypeAdd.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增数据字段</div><div class='clear10'></div><div class='list-detail'>对选定的数据类型添加新的数据字段</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataFieldToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑数据字段</div><div class='clear10'></div><div class='list-detail'>编辑选定数据类型中存在的数据字段内容</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataFieldToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除数据字段</div><div class='clear10'></div><div class='list-detail'>1.页面中选中要删除的行对应的复选框；<br/>2.单击删除按钮；<br/>3.单击确认按钮删除，单击取消按钮取消操作。</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataFieldDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
