<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>添加供应商</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">添加供应商</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>供应商编码</td><td>供应商的代码</td></tr><tr><td>供应商名称</td><td>供应商名称</td></tr><tr><td>备注</td><td>对供应商进行备注说明</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        新增供应商信息    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中的工具栏中单击新增按钮；<br/>2.在弹出的窗口中输入相应的供应商信息；<br/>3.最后单击保存。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Customer/VendorAdd.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
