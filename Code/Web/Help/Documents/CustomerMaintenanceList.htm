<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>客户信息</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">客户信息</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>客户简称</td><td>客户名称简化</td></tr><tr><td>客户全称</td><td>客户名字全称</td></tr><tr><td>城市</td><td>客户所在城市</td></tr><tr><td>省</td><td>客户所在省</td></tr><tr><td>国籍</td><td>客户所在国家</td></tr><tr><td>邮编</td><td>邮政编码</td></tr><tr><td>电子邮箱</td><td>电子邮箱地址</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所有的客户，可执行编辑、新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索客户</div><div class='clear10'></div><div class='list-detail'>1.输入客户简称、城市、省、等关键字；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Customer/CustomerSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增客户</div><div class='clear10'></div><div class='list-detail'>增加新的客户</div><div class='clear10'></div><div class='list-img'><div><img src='images/Customer/CustomerToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑客户</div><div class='clear10'></div><div class='list-detail'>编辑存在的客户</div><div class='clear10'></div><div class='list-img'><div><img src='images/Customer/CustomerToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除客户</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录；<br/>2.点击工具栏中的删除按钮：<br/>3.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Customer/CustomerDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
