<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>条码生产状态设定</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">条码生产状态设定</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>序列号</td><td>工厂内部产生的产品序列号</td></tr><tr><td>工位</td><td>序列号对应路由的所有非维修工位</td></tr><tr><td>描述</td><td>工位的说明</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所查询序列号对应路由的所有非维修工位，可执行移动操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索</div><div class='clear10'></div><div class='list-detail'>1.输入序列号；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductChange/SNRouteOperationSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>移动</div><div class='clear10'></div><div class='list-detail'>1.选中要移动的目标工位名称后单击左上角移动按钮；<br/>2.选择Ok移动到目标工位，选择Cancel取消操作。</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductChange/SNStepChange.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
