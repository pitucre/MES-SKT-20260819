<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>退料给线边仓</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">退料给线边仓</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>工单编号</td><td>要退物料对应的工单编号</td></tr><tr><td>GRN</td><td>要退料的GRN条码</td></tr><tr><td>数量</td><td>要退料的GRN数量</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        产线退料到线边仓    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>退料</div><div class='clear10'></div><div class='list-detail'>1.选择工单，输入要退料的GRN，然后输入要退料的数量；<br/>2.单击左上角退料按钮，单击ok确定，单击cancel取消操作。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Material/ProductionReturn.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
