<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>包装物料</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">包装物料</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>供应商</td><td>供应商代码</td></tr><tr><td>GRN</td><td>物料条码</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        可执行GRN包装、包装箱关闭、打开空的包装箱操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>包装GRN</div><div class='clear10'></div><div class='list-detail'>1.选择供应商；<br/>2.扫描物料GRN，如果是第一个物料GRN，系统验证无  误后自动生成一个包装箱号；<br/>3.当包装满箱时，单击工具栏中的关闭包装箱即可；<br/>4.当系统存在空的包装箱号时，可先单击选择空的包装箱按钮，然后重复2，3步操作。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Material/PackingGRN.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
