<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>发料</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">发料</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>工单</td><td>生产工单单号</td></tr><tr><td>工单数量</td><td>工单对应的数量</td></tr><tr><td>工单标识</td><td>无实际意义，保留字段</td></tr><tr><td>线别</td><td>生产的线别</td></tr><tr><td>发料到</td><td>目标位置</td></tr><tr><td>序号</td><td>发放物料的次序号</td></tr><tr><td>物料编码</td><td>物料代码</td></tr><tr><td>领料数量</td><td>物料所需领用的数量</td></tr><tr><td>已发放GRN</td><td>物料对应发放的GRN</td></tr><tr><td>箱中GRN数量</td><td>如果是包装箱发料，则显示改箱中GRN的数量，如果是GRN直接发料，则数量为0</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        可按工单进行发料，也可直接按物料箱号或GRN发料    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>发料</div><div class='clear10'></div><div class='list-detail'>1.选择或输入要发料的工单，系统自动带出工单对应的信息。也可不输入工单；<br/>2.选择发放的目标位置；<br/>3.然后逐个扫描所需物料的GRN。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Material/MaterialIssue.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
