<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>新增掩码</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">新增掩码</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>掩码组名</td><td>掩码组别名称</td></tr><tr><td>描述</td><td>对该掩码组别的解释</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        新增掩码    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中单击新增按钮；<br/>2.输入掩码组名称和相关描述；<br/>3.单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/MaskGroup/MaskGroupAdd.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增掩码元素</div><div class='clear10'></div><div class='list-detail'>对选定掩码组别名称增加新的元素</div><div class='clear10'></div><div class='list-img'><div><img src='images/MaskGroup/MaskMemberToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑掩码元素</div><div class='clear10'></div><div class='list-detail'>对选定掩码组别名称中存在的元素进行修改</div><div class='clear10'></div><div class='list-img'><div><img src='images/MaskGroup/MaskMemberToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除掩码元素</div><div class='clear10'></div><div class='list-detail'>1.页面中选中要删除的行对应的复选框；<br/>2.单击删除按钮；<br/>3.单击确认按钮删除，单击取消按钮取消操作。</div><div class='clear10'></div><div class='list-img'><div><img src='images/MaskGroup/MaskMemberDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
