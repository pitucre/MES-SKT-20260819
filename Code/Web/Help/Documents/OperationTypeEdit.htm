<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>编辑工位类型</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">编辑工位类型</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>工位类型</td><td>工位类型名称</td></tr><tr><td>描述</td><td>工位类型描述</td></tr><tr><td>UI模板</td><td>操作该工位时的用户模板</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        编辑存在的工位类型    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页中选中记录后单击编辑按钮；<br/>2.修改工位类型相关信息；<br/>3.单击保存按钮</div><div class='clear10'></div><div class='list-img'><div><img src='images/OperationMaintenance/OperationTypeEdit.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>分配工位</div><div class='clear10'></div><div class='list-detail'>1.左边框中选择可分配的工位；<br/>2.单击向右或向左按钮实现工位分配或移除已分配的工位；<br/>3.右边框中选择已分配的工位后执行第2步操作；<br/>4.单击保存按钮</div><div class='clear10'></div><div class='list-img'><div><img src='images/OperationMaintenance/OperationTypeAssignOperation.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
