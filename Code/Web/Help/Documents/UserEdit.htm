<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>编辑用户</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">编辑用户</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>登录名</td><td>用来登录系统的账号，编辑状态下不能修改</td></tr><tr><td>工号</td><td>员工工号</td></tr><tr><td>中文名</td><td>中文名称</td></tr><tr><td>英文名</td><td>英文名称</td></tr><tr><td>密码</td><td>登陆系统时用的密码，编辑状态下不能修改</td></tr><tr><td>部门名称</td><td>下拉选择系统存在的部门名臣</td></tr><tr><td>主管</td><td>该用户的主管，从系统中选择存在的用户</td></tr><tr><td>邮箱</td><td>用户的公司邮箱</td></tr><tr><td>电话</td><td>用户的公司电话</td></tr><tr><td>入职日期</td><td>入职日期</td></tr><tr><td>离职日期</td><td>离职日期</td></tr><tr><td>状态</td><td>活动：有效状态；<br/>非活动：无效状态；<br/>离职：离职后的状态</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        编辑系统中存在的用户    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中选择记录后单击编辑按钮；<br/>2.输入相关数据，带红色必填；<br/>3.单击保存按钮</div><div class='clear10'></div><div class='list-img'><div><img src='images/UserManage/UserEdit.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
