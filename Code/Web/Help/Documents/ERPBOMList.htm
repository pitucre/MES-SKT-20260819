<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>ERP物料清单列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">ERP物料清单列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>物料清单名</td><td>物料清单名称</td></tr><tr><td>序号</td><td>物料在清单里面的次序</td></tr><tr><td>产品名称</td><td>物料清单中物料的编码</td></tr><tr><td>用量</td><td>物料在清单中的用量</td></tr><tr><td>需求数量</td><td>物料在清单中的需求数量</td></tr><tr><td>已发数量</td><td>物料已发放的数量</td></tr><tr><td>工位</td><td>物料在MES中使用位置</td></tr><tr><td>标识</td><td>保留字段</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        查询、复制物料清单列表    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>查询</div><div class='clear10'></div><div class='list-detail'>输入物料清单名称的关键字后点击搜索按钮即可（图示1）</div><div class='clear10'></div><div class='list-img'><div><img src='images/Mod_ShopOrderMaintenance/ERPBomList.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>导入物料清单</div><div class='clear10'></div><div class='list-detail'>输入物料清单名称的关键字后点击导入按钮即可（图示2）</div><div class='clear10'></div><div class='list-img'><div><img src='images/Mod_ShopOrderMaintenance/ERPBomImport.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>复制物料清单</div><div class='clear10'></div><div class='list-detail'>1.单击主页面中的复制物料清单按钮；<br/>2.在原物料清单中输入物料清单名称，目标物料清单中输入物料清单名称；<br/>3.最后单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Mod_ShopOrderMaintenance/ERPBomCopy.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
