<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>分料/截料</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">分料/截料</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>子GRN条码</td><td>分料的子GRN条码</td></tr><tr><td>子GRN数量</td><td>分料的子GRN数量</td></tr><tr><td>供应商</td><td>供应商编码</td></tr><tr><td>物料名称</td><td>物料代码</td></tr><tr><td>物料描述</td><td>物料描述</td></tr><tr><td>分料时间</td><td>分料的时间</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        执行分料截料操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>分料</div><div class='clear10'></div><div class='list-detail'>1.输入要分料的GRN，系统自动带出相应的数量，然后输入要分料出来的数量；<br/>2.单击左上角分料按钮，单击ok确定，单击cancel取消操作。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Material/MaterialSplit.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
