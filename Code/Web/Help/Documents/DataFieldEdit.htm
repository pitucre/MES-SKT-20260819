<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>编辑数据类型字段</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">编辑数据类型字段</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>次序</td><td>数据类型名称中字段验证的先后次序，编辑时为不可修改状态</td></tr><tr><td>数据字段</td><td>用来表示数据字段的名称</td></tr><tr><td>数据标示</td><td>标示数据字段的标签</td></tr><tr><td>掩码组名</td><td>选择用来关联数据需要验证时用到的掩码验证规则</td></tr><tr><td>数据类型</td><td>选择数据字段的类型，系统提供四种数据收集类型。Text：文本；Date：日期型；Number：数字型；CheckBox：复选框型</td></tr><tr><td>必要项</td><td>勾选标示必须输入内容针对该数据字段</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        编辑数据字段元素    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中选中记录后单击编辑按钮；<br/>2.修改数据字段相关内容；<br/>3.单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/DataType/DataFieldEdit.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
