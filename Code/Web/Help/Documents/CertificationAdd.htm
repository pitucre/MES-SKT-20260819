<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>新建岗位资格认证</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">新建岗位资格认证</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>认证名称</td><td>岗位认证的名称</td></tr><tr><td>认证类型</td><td>1.Skill：特定操作工位的认证；<br/>2.License：特定操作资源的认证；<br/>3.Qualification：特定产品的认证</td></tr><tr><td>描述</td><td>认证的说明</td></tr><tr><td>有效天</td><td>认证的有效天数</td></tr><tr><td>到期提前警告天数</td><td>认证的到期前多少天警告</td></tr><tr><td>到期行为</td><td>认证到期后处理的事件</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        增加新的岗位认证    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>保存</div><div class='clear10'></div><div class='list-detail'>1.主页面中单击新增按钮；<br/>2.输入认证相关信息；<br/>3.单击保存按钮。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Certification/CertificationListAdd.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
