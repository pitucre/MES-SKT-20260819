<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>生产班次列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">生产班次列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>班别名称</td><td>班别的命名</td></tr><tr><td>班别说明</td><td>班别的解释说明</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示系统所有的班别，可执行编辑、新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索班别</div><div class='clear10'></div><div class='list-detail'>1.输入班别关键字；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductionShift/ShiftListSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增班别</div><div class='clear10'></div><div class='list-detail'>增加新的班别</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductionShift/ShiftListToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑班别</div><div class='clear10'></div><div class='list-detail'>编辑存在的班别</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductionShift/ShiftListToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除班别</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录后单击删除按钮；<br/>2.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/ProductionShift/ShiftListDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
