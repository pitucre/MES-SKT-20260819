<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>容器列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">容器列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>容器名称</td><td>容器名称</td></tr><tr><td>混合存放</td><td>是否混合包装</td></tr><tr><td>容器类型</td><td>容器所属类型</td></tr><tr><td>状态</td><td>容器状态：<br/>1.Enabled<br/>2.Disabled</td></tr><tr><td>描述</td><td>容器描述</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所有的容器，可执行编辑、新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索容器</div><div class='clear10'></div><div class='list-detail'>1.输入容器名称关键字；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Container/ContainerSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增容器</div><div class='clear10'></div><div class='list-detail'>增加新的容器</div><div class='clear10'></div><div class='list-img'><div><img src='images/Container/ContainerToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑容器</div><div class='clear10'></div><div class='list-detail'>编辑存在的容器</div><div class='clear10'></div><div class='list-img'><div><img src='images/Container/ContainerToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除部容器</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录；<br/>2.点击工具栏中的删除按钮：<br/>3.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/Container/ContainerDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
