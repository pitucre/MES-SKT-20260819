<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>    <title>不良代码列表</title>    <meta http-equiv="Content-Type" content="text/html;charset=gb2312"/>    <link href="../css/help.css" rel="stylesheet" type="text/css" /></head><body style="padding:5px;"><!--??????????--><div class="help-page-title">    <div class="help-line"></div>    <div class="title-text">不良代码列表</div></div><!--??????--><div class="clear10"></div><!--???????--><div class="help-field-desc">    <div class="field-desc">        <div class="field-desc-title">字段描述</div>    </div>    <div class="field-desc-content">        <table cellpadding="5" cellspacing="1" border="0" style=" background:#DBDBDB">            <tbody style="background:#ffffff;">                <tr style="background:#f8f8f8; height:30px; font-weight:bold;">                    <td>字段名</td>                    <td>描述</td>                </tr>                <tr><td>不良代码编码</td><td>不良代码编码</td></tr><tr><td>类别</td><td>不良代码所属类别</td></tr><tr><td>数据类型</td><td>不良代码类型:<br/>1.Failure 不及格<br/>2.Defect 缺陷<br/>3.Repair  维修<br/></td></tr><tr><td>状态</td><td>不良代码状态：<br/>1.Enabled   可用           <br/>2.Disabled   不可用</td></tr><tr><td>描述</td><td>不良代码描述</td></tr>            </tbody>            </table>    </div></div><!--??????--><div class="clear10"></div><!--????????--><div class="help-fun-desc">    <div class="fun-desc">        <div class="fun-desc-title">功能描述</div>    </div>    <!--??????-->    <div class="fun-desc-detail">        显示所有的不良代码，可执行编辑、新增、删除操作    </div>    <!--??????-->    <div class="clear10"></div>    <!--???????????-->    <div class="fun-desc-detail-list">        <div><div class='list-title'>搜索不良代码</div><div class='clear10'></div><div class='list-detail'>1.输入不良代码编码关键字；<br/>2.点击搜索按钮后列表显示结果。</div><div class='clear10'></div><div class='list-img'><div><img src='images/NCCode/NCCodeSearch.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>新增不良代码</div><div class='clear10'></div><div class='list-detail'>增加新的不良代码</div><div class='clear10'></div><div class='list-img'><div><img src='images/NCCode/NCCodeToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>编辑不良代码</div><div class='clear10'></div><div class='list-detail'>编辑存在的不良代码</div><div class='clear10'></div><div class='list-img'><div><img src='images/NCCode/NCCodeToolBar.gif' alt=''/></div></div></div><div class='clear10'></div><div><div class='list-title'>删除不良代码</div><div class='clear10'></div><div class='list-detail'>1.在列表中选中记录；<br/>2.点击工具栏中的删除按钮：<br/>3.在弹出的对话框中选择Ok或Cancel。</div><div class='clear10'></div><div class='list-img'><div><img src='images/NCCode/NCCodeDelete.gif' alt=''/></div></div></div><div class='clear10'></div>    </div></div></body></html>
