<style type="text/css">
    #divReport
    {
        height: auto;
    }
    #divChart
    {
        height: auto;
    }
    #ChartContainer
    {
        width: 100%;
        height: 450px;
        overflow: hidden;
    }
    #ChartA, #ChartB
    {
        float: left;
        width: 49.6%;
        height: 450px;
    }
    #ChartB
    {
        float: right;
    }
</style>
<table class="EditeContentTable" style="width: 100%; margin-bottom: 2px;">
    <tr class="ListTableHeader">
        <th id="title" scope="col" colspan="6">P94 注塑机停机与状态分析</th>
    </tr>
    <tr>
        <td class="Label4">开始日期</td>
        <td class="Field4">
            <input type="text" id="txtStartTime" class="DateTimeBox" /></td>
        <td class="Label4">结束日期</td>
        <td class="Field4">
            <input type="text" id="txtEndTime" class="DateTimeBox" /></td>
        <td class="Label4">机台</td>
        <td class="Field4">
            <input type="text" id="txtMachineCode" class="TextBox" /></td>
    </tr>
    <tr>
        <td class="Label4">状态码</td>
        <td class="Field4">
            <input type="text" id="txtStatus" class="TextBox" /></td>
        <td class="Label4">状态分类</td>
        <td class="Field4">
            <select id="selCategory" style="width: 130px;">
                <option value="">全部</option>
                <option value="故障">故障</option>
                <option value="换模">换模</option>
                <option value="调试试模">调试试模</option>
                <option value="计划停机">计划停机</option>
                <option value="烘料">烘料</option>
                <option value="缺料">缺料</option>
                <option value="人力不足">人力不足</option>
                <option value="未生产">未生产</option>
                <option value="生产运行">生产运行</option>
            </select></td>
        <td class="Label4"></td>
        <td class="Field4"></td>
    </tr>
    <tr>
        <td colspan="6">
            <div id="bnView" style="text-align: center; font-size: 16px; width: 20%; cursor: pointer; float: left; text-decoration: underline;">
                <img src="../Content/images/search.png" />查询</div>
            <div id="bnImport" style="font-size: 16px; cursor: pointer; text-decoration: underline; float: left; margin-left: 10px; width: 150px;">
                <img src="../Content/images/icon/Import.png" />导出到EXCEL</div>
        </td>
    </tr>
</table>
<input type="hidden" value="" id="hdnPararms" name="hdnPararms" />
<input type="hidden" value="" id="hdnPararmValue" name="hdnPararmValue" />
<input type="hidden" value="" id="hdnOperation" name="hdnOperation" />
<input type="hidden" value="" id="hdnFileName" name="hdnFileName" />
<div id="ReportList">
</div>
<div id="ChartContainer">
    <div id="ChartA">
    </div>
    <div id="ChartB">
    </div>
</div>
<script type="text/javascript">
    var biChart = { a: null, b: null, optA: null, optB: null };
    var biSpName = 'uspBI_DowntimeAnalysis_Program';

    $(function () {
        $(".DateTimeBox").datepicker({ showHms: true });
        $("#txtStartTime").val(GetDateStr(-30));
        $("#txtEndTime").val(GetDateStr(0));
        $(window).resize(function () {
            if (biChart.a) { biChart.a.resize(); }
            if (biChart.b) { biChart.b.resize(); }
        });
        setTimeout(function () { runQuery(); }, 400);
    });

    $(".wrap_tb ul.tb li").live("click", function () {
        var idx = $(this).index();
        setTimeout(function () {
            if (idx == 1) {
                showChart();
            } else {
                var $g = $("#ReportList");
                if ($g.length > 0) {
                    var gm = $g.SktMesGetGridManager();
                    if (gm && gm.onResize) { gm.onResize(); }
                }
            }
        }, 80);
    });

    function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

    function biFetchRows() {
        var tries = [true, false], k;
        for (k = 0; k < tries.length; k++) {
            var isProc = tries[k];
            biFetchRows.ok = false;
            biFetchRows.data = null;
            biFetchRows.msg = "";
            var req = {
                type: "post",
                url: "../Handler/ReportingServer.ashx?gridviewname=" + biSpName + "&rnd=" + Math.random(),
                data: { dataAction: "PROC", paramters: getParamStr() },
                dataType: "json",
                async: false,
                success: function (data) {
                    biFetchRows.ok = true;
                    biFetchRows.data = data;
                },
                error: function (xhr) {
                    biFetchRows.ok = false;
                    biFetchRows.msg = (xhr && xhr.status ? xhr.status + " " : "")
                        + (xhr && xhr.responseText ? xhr.responseText : "");
                }
            };
            if (isProc) {
                req.data.isProcPage = "true";
                req.data.page = "1";
                req.data.pagesize = "100000";
                req.data.conditions = "1=1";
            }
            $.ajax(req);
            if (biFetchRows.ok && biFetchRows.data && typeof biFetchRows.data === "object") {
                return biFetchRows.data;
            }
        }
        alert("Get Data Error: " + (biFetchRows.msg || "no response").substring(0, 400));
        return { Rows: [] };
    }
    function getParamStr() {
        return '[{"name":"@StartDate","type":"varchar","size":"100","value":"' + $("#txtStartTime").val() + '"}'
             + ',{"name":"@EndDate","type":"varchar","size":"100","value":"' + $("#txtEndTime").val() + '"}'
             + ',{"name":"@MachineCode","type":"varchar","size":"50","value":"' + $("#txtMachineCode").val() + '"}'
             + ',{"name":"@Status","type":"varchar","size":"10","value":"' + $("#txtStatus").val() + '"}'
             + ',{"name":"@Category","type":"varchar","size":"50","value":"' + $("#selCategory").val() + '"}]';
    }

    function runQuery() {
        $("#divLoading").hide().remove();
        $("#ReportList").replaceWith("<div id='ReportList'></div>");
        $("#ReportList").SktMesGrid({
            columns: [
                { display: '日期', name: '日期', align: 'center', width: 90, minWidth: 60 },
                { display: '机台', name: '机台', align: 'center', width: 70, minWidth: 60 },
                { display: '机台名称', name: '机台名称', align: 'left', width: 100, minWidth: 60 },
                { display: '状态码', name: '状态码', align: 'center', width: 70, minWidth: 60 },
                { display: '状态说明', name: '状态说明', align: 'left', width: 100, minWidth: 60 },
                { display: '状态分类', name: '状态分类', align: 'center', width: 90, minWidth: 60 },
                { display: '白班(小时)', name: '白班小时', align: 'right', width: 90, minWidth: 60 },
                { display: '夜班(小时)', name: '夜班小时', align: 'right', width: 90, minWidth: 60 },
                { display: '合计(小时)', name: '合计小时', align: 'right', width: 90, minWidth: 60 },
                { display: '占机台当日(%)', name: '占机台当日%', align: 'right', width: 110, minWidth: 60 }
            ],
            width: '100%',
            height: '99%',
            dataAction: 'PROC',
            dataSource: biSpName,
            paramters: getParamStr(),
            pageSize: 50,
            isProcPage: true
        });
        var ds = biFetchRows();
        buildChart(ds && ds.Rows ? ds.Rows : []);
        showChart();
    }

    $("#bnView").click(function () { runQuery(); });

    $("#bnImport").click(function () {
        $("#hdnPararms").val("@StartDate,@EndDate,@MachineCode,@Status,@Category");
        $("#hdnPararmValue").val($("#txtStartTime").val() + "," + $("#txtEndTime").val() + "," + $("#txtMachineCode").val() + "," + $("#txtStatus").val() + "," + $("#selCategory").val());
        $("#hdnOperation").val(biSpName);
        $("#hdnFileName").val('P94 注塑机停机与状态分析');
        document.forms[0].submit();
    });

    function buildChart(rows) {
        var catMap = {}, cats = [], machDown = {}, machs = [];
        var i;
        for (i = 0; i < rows.length; i++) {
            var r = rows[i];
            var c = r['状态分类'] || '其他';
            var hrs = num(r['合计小时']);
            catMap[c] = (catMap[c] || 0) + hrs;
            if (cats.indexOf(c) < 0) { cats.push(c); }
            if (c !== '生产运行' && c !== '未生产') {
                var m = r['机台'] || '';
                machDown[m] = (machDown[m] || 0) + hrs;
                if (machs.indexOf(m) < 0) { machs.push(m); }
            }
        }
        machs.sort(function (x, y) { return machDown[y] - machDown[x]; });
        var topM = machs.slice(0, 10), topV = [];
        for (i = 0; i < topM.length; i++) { topV.push(Math.round(machDown[topM[i]] * 100) / 100); }
        topM.reverse(); topV.reverse();
        var pieData = cats.map(function (c) { return { name: c, value: Math.round(catMap[c] * 100) / 100 }; });
        biChart.optA = {
            title: { text: '状态分类占比(小时)', left: 'center' },
            tooltip: { trigger: 'item', formatter: '{b}: {c} h ({d}%)' },
            legend: { bottom: 0, type: 'scroll' },
            series: [{
                type: 'pie', radius: ['35%', '62%'], center: ['50%', '48%'],
                data: pieData,
                label: { formatter: '{b}\n{d}%' }
            }]
        };
        biChart.optB = {
            title: { text: '机台停机小时TOP10(不含生产/未生产)', left: 'center' },
            tooltip: { trigger: 'axis' },
            grid: { left: 10, right: 70, top: 50, bottom: 40 },
            xAxis: { type: 'value', name: '小时' },
            yAxis: { type: 'category', data: topM },
            series: [{ name: '停机小时', type: 'bar', data: topV, label: { show: true, position: 'right' } }]
        };
    }

    function showChart() {
        if (!biChart.optA || !biChart.optB) { return; }
        var el = document.getElementById('ChartA');
        if (!el || el.offsetWidth === 0) { return; }
        if (!biChart.a) {
            biChart.a = echarts.init(el);
            biChart.b = echarts.init(document.getElementById('ChartB'));
        }
        biChart.a.setOption(biChart.optA, true);
        biChart.b.setOption(biChart.optB, true);
    }
</script>
