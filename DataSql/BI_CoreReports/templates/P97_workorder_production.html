<style type="text/css">
    #divReport
    {
        height: auto;
    }
    #divChart
    {
        height: auto;
    }
    #ChartContainer
    {
        width: 100%;
        height: 450px;
        overflow: hidden;
    }
    #ChartA, #ChartB
    {
        float: left;
        width: 49.6%;
        height: 450px;
    }
    #ChartB
    {
        float: right;
    }
</style>
<table class="EditeContentTable" style="width: 100%; margin-bottom: 2px;">
    <tr class="ListTableHeader">
        <th id="title" scope="col" colspan="8">P97_工单产品生产报表</th>
    </tr>
    <tr>
        <td class="Label4">开始日期</td>
        <td class="Field4">
            <input type="text" id="txtStartTime" class="DateTimeBox" /></td>
        <td class="Label4">结束日期</td>
        <td class="Field4">
            <input type="text" id="txtEndTime" class="DateTimeBox" /></td>
        <td class="Label4">工单号</td>
        <td class="Field4">
            <input type="text" id="txtOrderNo" style="width: 140px;" placeholder="模糊匹配" /></td>
        <td class="Label4">设备编码</td>
        <td class="Field4">
            <input type="text" id="txtEquipCode" style="width: 120px;" placeholder="旧码或机号" /></td>
    </tr>
    <tr>
        <td colspan="8">
            <div id="bnView" style="text-align: center; font-size: 16px; width: 20%; cursor: pointer; float: left; text-decoration: underline;">
                <img src="../Content/images/search.png" />查询</div>
            <div id="bnImport" style="font-size: 16px; cursor: pointer; text-decoration: underline; float: left; margin-left: 10px; width: 150px;">
                <img src="../Content/images/icon/Import.png" />导出到EXCEL</div>
        </td>
    </tr>
</table>
<input type="hidden" value="" id="hdnPararms" name="hdnPararms" />
<input type="hidden" value="" id="hdnPararmValue" name="hdnPararmValue" />
<input type="hidden" value="" id="hdnOperation" name="hdnOperation" />
<input type="hidden" value="" id="hdnFileName" name="hdnFileName" />
<div id="ReportList">
</div>
<div id="ChartContainer">
    <div id="ChartA">
    </div>
    <div id="ChartB">
    </div>
</div>
<div id="drillMask" style="display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; opacity: 0.35; z-index: 9998;">
</div>
<div id="drillPanel" style="display: none; position: fixed; left: 3%; top: 3%; width: 94%; height: 92%; background: #fff; border: 2px solid #4a7bb0; z-index: 9999; overflow: auto; padding: 8px;">
    <div style="text-align: right;">
        <span id="drillClose" style="cursor: pointer; color: #e02020; font-weight: bold; font-size: 16px; padding: 2px 10px;">关闭 X</span></div>
    <div id="drillTitle" style="font-size: 15px; font-weight: bold; margin: 0 0 8px 0;">
    </div>
    <div id="drillSec1" style="margin-bottom: 14px;">
    </div>
    <div id="drillSec2">
    </div>
</div>
<script type="text/javascript">
    var biChart = { a: null, b: null, optA: null, optB: null };
    var biSpName = 'uspBI_WorkOrderProductionReport_Program';

    $(function () {
        $(".DateTimeBox").datepicker({ showHms: true });
        $("#txtStartTime").val(GetDateStr(-30));
        $("#txtEndTime").val(GetDateStr(0));
        $(window).resize(function () {
            if (biChart.a) { biChart.a.resize(); }
            if (biChart.b) { biChart.b.resize(); }
        });
        setTimeout(function () { runQuery(); }, 400);
    });

    $(".wrap_tb ul.tb li").live("click", function () {
        var idx = $(this).index();
        setTimeout(function () {
            if (idx == 1) {
                showChart();
            } else {
                var $g = $("#ReportList");
                if ($g.length > 0) {
                    var gm = $g.SktMesGetGridManager();
                    if (gm && gm.onResize) { gm.onResize(); }
                }
            }
        }, 80);
    });

    function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
    function biEmpty(v) {
        return v === null || v === undefined || String(v).replace(/^\s+|\s+$/g, '') === '';
    }
    function biRedMiss(label) {
        return '<span style="color:#e02020;font-weight:bold" title="' + label + '缺失">—</span>';
    }
    function biEsc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function biDrillCell(row, v) {
        return '<a href="javascript:void(0)" class="biDrillLink" data-o="' + biEsc(row['工单号'])
            + '" data-d="' + biEsc(row['生产日期']) + '" style="color:#1a5fb4; text-decoration: underline;" title="点击查看用料明细">'
            + biEsc(v) + '</a>';
    }

    function biFetchRows() {
        var tries = [true, false], k;
        for (k = 0; k < tries.length; k++) {
            var isProc = tries[k];
            biFetchRows.ok = false;
            biFetchRows.data = null;
            biFetchRows.msg = "";
            var req = {
                type: "post",
                url: "../Handler/ReportingServer.ashx?gridviewname=" + biSpName + "&rnd=" + Math.random(),
                data: { dataAction: "PROC", paramters: getParamStr() },
                dataType: "json",
                async: false,
                success: function (data) {
                    biFetchRows.ok = true;
                    biFetchRows.data = data;
                },
                error: function (xhr) {
                    biFetchRows.ok = false;
                    biFetchRows.msg = (xhr && xhr.status ? xhr.status + " " : "")
                        + (xhr && xhr.responseText ? xhr.responseText : "");
                }
            };
            if (isProc) {
                req.data.isProcPage = "true";
                req.data.page = "1";
                req.data.pagesize = "100000";
                req.data.conditions = "1=1";
            }
            $.ajax(req);
            if (biFetchRows.ok && biFetchRows.data && typeof biFetchRows.data === "object") {
                return biFetchRows.data;
            }
        }
        alert("Get Data Error: " + (biFetchRows.msg || "no response").substring(0, 400));
        return { Rows: [] };
    }
    function getParamStr() {
        return '[{"name":"@StartDate","type":"varchar","size":"100","value":"' + $("#txtStartTime").val() + '"}'
             + ',{"name":"@EndDate","type":"varchar","size":"100","value":"' + $("#txtEndTime").val() + '"}'
             + ',{"name":"@OrderNo","type":"varchar","size":"50","value":"' + $("#txtOrderNo").val() + '"}'
             + ',{"name":"@EquipmentCode","type":"varchar","size":"50","value":"' + $("#txtEquipCode").val() + '"}]';
    }

    function runQuery() {
        $("#divLoading").hide().remove();
        $("#ReportList").replaceWith("<div id='ReportList'></div>");
        $("#ReportList").SktMesGrid({
            columns: [
                { display: '工单号', name: '工单号', align: 'center', width: 130, minWidth: 60 },
                { display: '产品编码', name: '产品编码', align: 'center', width: 100, minWidth: 60 },
                { display: '产品名称', name: '产品名称', align: 'left', width: 180, minWidth: 60 },
                { display: '模具', name: '模具', align: 'center', width: 90, minWidth: 50,
                  render: function (row, i, v) { return biEmpty(v) ? biRedMiss('模具') : v; } },
                { display: '模穴数', name: '模穴数', align: 'right', width: 65, minWidth: 40,
                  render: function (row, i, v) { return biEmpty(v) ? biRedMiss('模穴数') : v; } },
                { display: '设备编码', name: '设备编码', align: 'center', width: 90, minWidth: 50 },
                { display: '生产日期', name: '生产日期', align: 'center', width: 150, minWidth: 80 },
                { display: '开关模次数', name: '开关模次数', align: 'right', width: 100, minWidth: 60 },
                { display: '计划数', name: '计划数', align: 'right', width: 85, minWidth: 55 },
                { display: '实际产品数', name: '实际产品数', align: 'right', width: 100, minWidth: 60 },
                { display: '良品数', name: '良品数', align: 'right', width: 90, minWidth: 60 },
                { display: '良品数', name: '良品数', align: 'right', width: 90, minWidth: 60,
                  render: function (row, i, v) { return biDrillCell(row, v); } },
                { display: '不良数', name: '不良数', align: 'right', width: 80, minWidth: 60,
                  render: function (row, i, v) { return biDrillCell(row, v); } },
                { display: '完工检验数量', name: '完工检验数量', align: 'right', width: 110, minWidth: 70 },
                { display: '入库数量', name: '入库数量', align: 'right', width: 95, minWidth: 60 },
                { display: '待入库数量', name: '待入库数量', align: 'right', width: 95, minWidth: 60 },
                { display: '产出待入库数量', name: '产出待入库数量', align: 'right', width: 115, minWidth: 70 },
                { display: '完工率%', name: '完工率%', align: 'right', width: 85, minWidth: 50 },
                { display: '良品率%', name: '良品率%', align: 'right', width: 85, minWidth: 50 }
            ],
            width: '100%',
            height: '99%',
            dataAction: 'PROC',
            dataSource: biSpName,
            paramters: getParamStr(),
            pageSize: 50,
            isProcPage: true
        });
        var ds = biFetchRows();
        buildChart(ds && ds.Rows ? ds.Rows : []);
        showChart();
    }

    $("#bnView").click(function () { runQuery(); });

    $("#bnImport").click(function () {
        $("#hdnPararms").val("@StartDate,@EndDate,@OrderNo,@EquipmentCode");
        $("#hdnPararmValue").val($("#txtStartTime").val() + "," + $("#txtEndTime").val() + "," + $("#txtOrderNo").val() + "," + $("#txtEquipCode").val());
        $("#hdnOperation").val(biSpName);
        $("#hdnFileName").val('P97_工单产品生产报表');
        document.forms[0].submit();
    });

    function buildChart(rows) {
        var i, list = [];
        for (i = 0; i < rows.length; i++) {
            list.push({
                name: rows[i]['工单号'] || '',
                shots: num(rows[i]['开关模次数']),
                act: num(rows[i]['实际产品数']),
                ok: num(rows[i]['良品数'])
            });
        }
        var byAct = list.slice(0).sort(function (x, y) { return y.act - x.act; }).slice(0, 10);
        var aLabels = [], aAct = [], aOk = [];
        for (i = byAct.length - 1; i >= 0; i--) {
            aLabels.push(byAct[i].name);
            aAct.push(byAct[i].act);
            aOk.push(byAct[i].ok);
        }
        biChart.optA = {
            title: { text: '实际产品数TOP10工单', left: 'center' },
            tooltip: { trigger: 'axis' },
            legend: { data: ['实际产品数', '良品数'], top: 28 },
            grid: { left: 140, right: 70, top: 70, bottom: 40 },
            xAxis: { type: 'value', name: '数量' },
            yAxis: { type: 'category', data: aLabels, axisLabel: { width: 128, overflow: 'truncate' } },
            series: [
                { name: '实际产品数', type: 'bar', data: aAct },
                { name: '良品数', type: 'bar', data: aOk }
            ]
        };
        var byShots = list.slice(0).sort(function (x, y) { return y.shots - x.shots; }).slice(0, 10);
        var sLabels = [], sShots = [];
        for (i = byShots.length - 1; i >= 0; i--) {
            sLabels.push(byShots[i].name);
            sShots.push(byShots[i].shots);
        }
        biChart.optB = {
            title: { text: '开关模次数TOP10工单', left: 'center' },
            tooltip: { trigger: 'axis' },
            grid: { left: 140, right: 70, top: 50, bottom: 40 },
            xAxis: { type: 'value', name: '次数' },
            yAxis: { type: 'category', data: sLabels, axisLabel: { width: 128, overflow: 'truncate' } },
            series: [{ name: '开关模次数', type: 'bar', data: sShots, label: { show: true, position: 'right' } }]
        };
    }

    function showChart() {
        if (!biChart.optA || !biChart.optB) { return; }
        var el = document.getElementById('ChartA');
        if (!el || el.offsetWidth === 0) { return; }
        if (!biChart.a) {
            biChart.a = echarts.init(el);
            biChart.b = echarts.init(document.getElementById('ChartB'));
        }
        biChart.a.setOption(biChart.optA, true);
        biChart.b.setOption(biChart.optB, true);
    }

    var biDrillSp = 'uspBI_WorkOrderMaterialDrill_Program';
    var biLoadCols = ['上料时间', '机台资源', '料桶', '原料编码', '原料名称', 'GRN', '上料数量', '操作类型', '操作人'];
    var biBomCols = ['原料编码', '原料名称', '单位', '单用量', '良品数', '良品消耗量', '不良品数', '不良品消耗量', '期间上料量', '生产日期'];

    function biDrillFetch(order, sd, ed, mode) {
        var res = null;
        $.ajax({
            type: 'post',
            url: '../Handler/ReportingServer.ashx?gridviewname=' + biDrillSp + '&rnd=' + Math.random(),
            data: {
                dataAction: 'PROC',
                paramters: '[{"name":"@OrderNo","type":"varchar","size":"50","value":"' + biEsc(order) + '"}'
                    + ',{"name":"@StartDate","type":"varchar","size":"20","value":"' + biEsc(sd) + '"}'
                    + ',{"name":"@EndDate","type":"varchar","size":"20","value":"' + biEsc(ed) + '"}'
                    + ',{"name":"@Mode","type":"varchar","size":"10","value":"' + biEsc(mode) + '"}]'
            },
            dataType: 'json',
            async: false,
            success: function (d) { res = d; },
            error: function () { res = null; }
        });
        return res;
    }

    function biRenderTable(cols, rows) {
        if (!rows || rows.length === 0) {
            return '<div style="color: #999; margin: 4px 0 10px 0;">(无记录)</div>';
        }
        var h = '<table class="EditeContentTable" style="width: 100%;"><tr class="ListTableHeader">', c, r;
        for (c = 0; c < cols.length; c++) { h += '<th>' + cols[c] + '</th>'; }
        h += '</tr>';
        for (r = 0; r < rows.length; r++) {
            h += '<tr>';
            for (c = 0; c < cols.length; c++) {
                h += '<td style="border: 1px solid #ccc; padding: 2px 5px; text-align: center;">'
                    + biEsc(rows[r][cols[c]]) + '</td>';
            }
            h += '</tr>';
        }
        return h + '</table><div style="height: 6px;"></div>';
    }

    $('.biDrillLink').live('click', function () {
        var order = $(this).attr('data-o');
        var pdate = $(this).attr('data-d');
        var sd = pdate, ed = pdate;
        if (pdate && pdate.indexOf('~') >= 0) {
            var pp = pdate.split('~');
            sd = $.trim(pp[0]);
            ed = $.trim(pp[1]);
        }
        $('#drillTitle').text('工单 ' + order + '  用料明细  (生产日期 ' + pdate + ')');
        $('#drillSec1').html('<b>上料记录</b> <span style="color:#888;">该工单机台 + 生产日期窗口内</span><br/><span style="color:#999;">加载中...</span>');
        $('#drillSec2').html('<b>原料消耗 (基于工单BOM)</b><br/><span style="color:#999;">加载中...</span>');
        $('#drillMask, #drillPanel').show();
        var d1 = biDrillFetch(order, sd, ed, '1');
        var d2 = biDrillFetch(order, sd, ed, '2');
        var r1 = (d1 && d1.Rows) ? d1.Rows : null;
        var r2 = (d2 && d2.Rows) ? d2.Rows : null;
        $('#drillSec1').html('<b>上料记录</b> <span style="color:#888;">该工单机台 + 生产日期窗口内, 按时间倒序</span><br/>'
            + (r1 === null ? '<span style="color:#e02020;">加载失败</span>' : biRenderTable(biLoadCols, r1)));
        $('#drillSec2').html('<b>原料消耗 (基于工单BOM)</b> <span style="color:#888;">良品/不良品消耗量 = 单用量 × 对应数量; 期间上料量 = 同窗口同机台实际上料</span><br/>'
            + (r2 === null ? '<span style="color:#e02020;">加载失败</span>' : biRenderTable(biBomCols, r2)));
    });

    $('#drillClose, #drillMask').live('click', function () {
        $('#drillMask, #drillPanel').hide();
    });
</script>
