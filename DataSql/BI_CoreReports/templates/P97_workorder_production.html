<style type="text/css">
    #divReport
    {
        height: auto;
    }
    #divChart
    {
        height: auto;
    }
    #ChartContainer
    {
        width: 100%;
        height: 450px;
        overflow: hidden;
    }
    #ChartA, #ChartB
    {
        float: left;
        width: 49.6%;
        height: 450px;
    }
    #ChartB
    {
        float: right;
    }
</style>
<table class="EditeContentTable" style="width: 100%; margin-bottom: 2px;">
    <tr class="ListTableHeader">
        <th id="title" scope="col" colspan="8">P97_工单产品生产报表</th>
    </tr>
    <tr>
        <td class="Label4">开始日期</td>
        <td class="Field4">
            <input type="text" id="txtStartTime" class="DateTimeBox" /></td>
        <td class="Label4">结束日期</td>
        <td class="Field4">
            <input type="text" id="txtEndTime" class="DateTimeBox" /></td>
        <td class="Label4">工单号</td>
        <td class="Field4">
            <input type="text" id="txtOrderNo" style="width: 140px;" placeholder="模糊匹配" /></td>
        <td class="Label4">设备编码</td>
        <td class="Field4">
            <input type="text" id="txtEquipCode" style="width: 120px;" placeholder="旧码或机号" /></td>
    </tr>
    <tr>
        <td colspan="8">
            <div id="bnView" style="text-align: center; font-size: 16px; width: 20%; cursor: pointer; float: left; text-decoration: underline;">
                <img src="../Content/images/search.png" />查询</div>
            <div id="bnImport" style="font-size: 16px; cursor: pointer; text-decoration: underline; float: left; margin-left: 10px; width: 150px;">
                <img src="../Content/images/icon/Import.png" />导出到EXCEL</div>
        </td>
    </tr>
</table>
<input type="hidden" value="" id="hdnPararms" name="hdnPararms" />
<input type="hidden" value="" id="hdnPararmValue" name="hdnPararmValue" />
<input type="hidden" value="" id="hdnOperation" name="hdnOperation" />
<input type="hidden" value="" id="hdnFileName" name="hdnFileName" />
<div id="ReportList">
</div>
<div id="ChartContainer">
    <div id="ChartA">
    </div>
    <div id="ChartB">
    </div>
</div>
<script type="text/javascript">
    var biChart = { a: null, b: null, optA: null, optB: null };
    var biSpName = 'uspBI_WorkOrderProductionReport_Program';

    $(function () {
        $(".DateTimeBox").datepicker({ showHms: true });
        $("#txtStartTime").val(GetDateStr(-30));
        $("#txtEndTime").val(GetDateStr(0));
        $(window).resize(function () {
            if (biChart.a) { biChart.a.resize(); }
            if (biChart.b) { biChart.b.resize(); }
        });
        setTimeout(function () { runQuery(); }, 400);
    });

    $(".wrap_tb ul.tb li").live("click", function () {
        var idx = $(this).index();
        setTimeout(function () {
            if (idx == 1) {
                showChart();
            } else {
                var $g = $("#ReportList");
                if ($g.length > 0) {
                    var gm = $g.SktMesGetGridManager();
                    if (gm && gm.onResize) { gm.onResize(); }
                }
            }
        }, 80);
    });

    function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

    function biFetchRows() {
        var tries = [true, false], k;
        for (k = 0; k < tries.length; k++) {
            var isProc = tries[k];
            biFetchRows.ok = false;
            biFetchRows.data = null;
            biFetchRows.msg = "";
            var req = {
                type: "post",
                url: "../Handler/ReportingServer.ashx?gridviewname=" + biSpName + "&rnd=" + Math.random(),
                data: { dataAction: "PROC", paramters: getParamStr() },
                dataType: "json",
                async: false,
                success: function (data) {
                    biFetchRows.ok = true;
                    biFetchRows.data = data;
                },
                error: function (xhr) {
                    biFetchRows.ok = false;
                    biFetchRows.msg = (xhr && xhr.status ? xhr.status + " " : "")
                        + (xhr && xhr.responseText ? xhr.responseText : "");
                }
            };
            if (isProc) {
                req.data.isProcPage = "true";
                req.data.page = "1";
                req.data.pagesize = "100000";
                req.data.conditions = "1=1";
            }
            $.ajax(req);
            if (biFetchRows.ok && biFetchRows.data && typeof biFetchRows.data === "object") {
                return biFetchRows.data;
            }
        }
        alert("Get Data Error: " + (biFetchRows.msg || "no response").substring(0, 400));
        return { Rows: [] };
    }
    function getParamStr() {
        return '[{"name":"@StartDate","type":"varchar","size":"100","value":"' + $("#txtStartTime").val() + '"}'
             + ',{"name":"@EndDate","type":"varchar","size":"100","value":"' + $("#txtEndTime").val() + '"}'
             + ',{"name":"@OrderNo","type":"varchar","size":"50","value":"' + $("#txtOrderNo").val() + '"}'
             + ',{"name":"@EquipmentCode","type":"varchar","size":"50","value":"' + $("#txtEquipCode").val() + '"}]';
    }

    function runQuery() {
        $("#divLoading").hide().remove();
        $("#ReportList").replaceWith("<div id='ReportList'></div>");
        $("#ReportList").SktMesGrid({
            columns: [
                { display: '工单号', name: '工单号', align: 'center', width: 130, minWidth: 60 },
                { display: '产品编码', name: '产品编码', align: 'center', width: 100, minWidth: 60 },
                { display: '产品名称', name: '产品名称', align: 'left', width: 200, minWidth: 60 },
                { display: '模穴数', name: '模穴数', align: 'right', width: 65, minWidth: 40 },
                { display: '设备编码', name: '设备编码', align: 'center', width: 90, minWidth: 50 },
                { display: '生产日期', name: '生产日期', align: 'center', width: 150, minWidth: 80 },
                { display: '开关模次数', name: '开关模次数', align: 'right', width: 100, minWidth: 60 },
                { display: '实际产品数', name: '实际产品数', align: 'right', width: 100, minWidth: 60 },
                { display: '良品数', name: '良品数', align: 'right', width: 90, minWidth: 60 },
                { display: '不良数', name: '不良数', align: 'right', width: 80, minWidth: 60 },
                { display: '良品率%', name: '良品率%', align: 'right', width: 85, minWidth: 50 }
            ],
            width: '100%',
            height: '99%',
            dataAction: 'PROC',
            dataSource: biSpName,
            paramters: getParamStr(),
            pageSize: 50,
            isProcPage: true
        });
        var ds = biFetchRows();
        buildChart(ds && ds.Rows ? ds.Rows : []);
        showChart();
    }

    $("#bnView").click(function () { runQuery(); });

    $("#bnImport").click(function () {
        $("#hdnPararms").val("@StartDate,@EndDate,@OrderNo,@EquipmentCode");
        $("#hdnPararmValue").val($("#txtStartTime").val() + "," + $("#txtEndTime").val() + "," + $("#txtOrderNo").val() + "," + $("#txtEquipCode").val());
        $("#hdnOperation").val(biSpName);
        $("#hdnFileName").val('P97_工单产品生产报表');
        document.forms[0].submit();
    });

    function buildChart(rows) {
        var i, list = [];
        for (i = 0; i < rows.length; i++) {
            list.push({
                name: rows[i]['工单号'] || '',
                shots: num(rows[i]['开关模次数']),
                act: num(rows[i]['实际产品数']),
                ok: num(rows[i]['良品数'])
            });
        }
        var byAct = list.slice(0).sort(function (x, y) { return y.act - x.act; }).slice(0, 10);
        var aLabels = [], aAct = [], aOk = [];
        for (i = byAct.length - 1; i >= 0; i--) {
            aLabels.push(byAct[i].name);
            aAct.push(byAct[i].act);
            aOk.push(byAct[i].ok);
        }
        biChart.optA = {
            title: { text: '实际产品数TOP10工单', left: 'center' },
            tooltip: { trigger: 'axis' },
            legend: { data: ['实际产品数', '良品数'], top: 28 },
            grid: { left: 10, right: 70, top: 70, bottom: 40 },
            xAxis: { type: 'value', name: '数量' },
            yAxis: { type: 'category', data: aLabels },
            series: [
                { name: '实际产品数', type: 'bar', data: aAct },
                { name: '良品数', type: 'bar', data: aOk }
            ]
        };
        var byShots = list.slice(0).sort(function (x, y) { return y.shots - x.shots; }).slice(0, 10);
        var sLabels = [], sShots = [];
        for (i = byShots.length - 1; i >= 0; i--) {
            sLabels.push(byShots[i].name);
            sShots.push(byShots[i].shots);
        }
        biChart.optB = {
            title: { text: '开关模次数TOP10工单', left: 'center' },
            tooltip: { trigger: 'axis' },
            grid: { left: 10, right: 70, top: 50, bottom: 40 },
            xAxis: { type: 'value', name: '次数' },
            yAxis: { type: 'category', data: sLabels },
            series: [{ name: '开关模次数', type: 'bar', data: sShots, label: { show: true, position: 'right' } }]
        };
    }

    function showChart() {
        if (!biChart.optA || !biChart.optB) { return; }
        var el = document.getElementById('ChartA');
        if (!el || el.offsetWidth === 0) { return; }
        if (!biChart.a) {
            biChart.a = echarts.init(el);
            biChart.b = echarts.init(document.getElementById('ChartB'));
        }
        biChart.a.setOption(biChart.optA, true);
        biChart.b.setOption(biChart.optB, true);
    }
</script>
