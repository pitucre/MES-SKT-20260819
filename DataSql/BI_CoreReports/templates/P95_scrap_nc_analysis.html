<style type="text/css">
    #divReport
    {
        height: auto;
    }
    #divChart
    {
        height: auto;
    }
    #ChartContainer
    {
        width: 100%;
        height: 450px;
        overflow: hidden;
    }
    #ChartA, #ChartB
    {
        float: left;
        width: 49.6%;
        height: 450px;
    }
    #ChartB
    {
        float: right;
    }
</style>
<table class="EditeContentTable" style="width: 100%; margin-bottom: 2px;">
    <tr class="ListTableHeader">
        <th id="title" scope="col" colspan="6">P95 不良与报废登记分析</th>
    </tr>
    <tr>
        <td class="Label4">开始日期</td>
        <td class="Field4">
            <input type="text" id="txtStartTime" class="DateTimeBox" /></td>
        <td class="Label4">结束日期</td>
        <td class="Field4">
            <input type="text" id="txtEndTime" class="DateTimeBox" /></td>
        <td class="Label4">来源</td>
        <td class="Field4">
            <select id="selSource" style="width: 130px;">
                <option value="">全部</option>
                <option value="生产不良">生产不良</option>
                <option value="登记报废">登记报废</option>
            </select></td>
    </tr>
    <tr>
        <td class="Label4">不良代码</td>
        <td class="Field4">
            <input type="text" id="txtNCCode" class="TextBox" /></td>
        <td class="Label4">产品</td>
        <td class="Field4">
            <input type="text" id="txtItemCode" class="TextBox" /></td>
        <td class="Label4">机台</td>
        <td class="Field4">
            <input type="text" id="txtMachineCode" class="TextBox" /></td>
    </tr>
    <tr>
        <td colspan="6">
            <div id="bnView" style="text-align: center; font-size: 16px; width: 20%; cursor: pointer; float: left; text-decoration: underline;">
                <img src="../Content/images/search.png" />查询</div>
            <div id="bnImport" style="font-size: 16px; cursor: pointer; text-decoration: underline; float: left; margin-left: 10px; width: 150px;">
                <img src="../Content/images/icon/Import.png" />导出到EXCEL</div>
        </td>
    </tr>
</table>
<input type="hidden" value="" id="hdnPararms" name="hdnPararms" />
<input type="hidden" value="" id="hdnPararmValue" name="hdnPararmValue" />
<input type="hidden" value="" id="hdnOperation" name="hdnOperation" />
<input type="hidden" value="" id="hdnFileName" name="hdnFileName" />
<div id="ReportList">
</div>
<div id="ChartContainer">
    <div id="ChartA">
    </div>
    <div id="ChartB">
    </div>
</div>
<script type="text/javascript">
    var biChart = { a: null, b: null, optA: null, optB: null };
    var biSpName = 'uspBI_ScrapNcAnalysis_Program';

    $(function () {
        $(".DateTimeBox").datepicker({ showHms: true });
        $("#txtStartTime").val(GetDateStr(-30));
        $("#txtEndTime").val(GetDateStr(0));
        $(window).resize(function () {
            if (biChart.a) { biChart.a.resize(); }
            if (biChart.b) { biChart.b.resize(); }
        });
        setTimeout(function () { runQuery(); }, 400);
    });

    $(".wrap_tb ul.tb li").live("click", function () {
        var idx = $(this).index();
        setTimeout(function () {
            if (idx == 1) {
                showChart();
            } else {
                var $g = $("#ReportList");
                if ($g.length > 0) {
                    var gm = $g.SktMesGetGridManager();
                    if (gm && gm.onResize) { gm.onResize(); }
                }
            }
        }, 80);
    });

    function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

    function biFetchRows() {
        var tries = [true, false], k;
        for (k = 0; k < tries.length; k++) {
            var isProc = tries[k];
            biFetchRows.ok = false;
            biFetchRows.data = null;
            biFetchRows.msg = "";
            var req = {
                type: "post",
                url: "../Handler/ReportingServer.ashx?gridviewname=" + biSpName + "&rnd=" + Math.random(),
                data: { dataAction: "PROC", paramters: getParamStr() },
                dataType: "json",
                async: false,
                success: function (data) {
                    biFetchRows.ok = true;
                    biFetchRows.data = data;
                },
                error: function (xhr) {
                    biFetchRows.ok = false;
                    biFetchRows.msg = (xhr && xhr.status ? xhr.status + " " : "")
                        + (xhr && xhr.responseText ? xhr.responseText : "");
                }
            };
            if (isProc) {
                req.data.isProcPage = "true";
                req.data.page = "1";
                req.data.pagesize = "100000";
                req.data.conditions = "1=1";
            }
            $.ajax(req);
            if (biFetchRows.ok && biFetchRows.data && typeof biFetchRows.data === "object") {
                return biFetchRows.data;
            }
        }
        alert("Get Data Error: " + (biFetchRows.msg || "no response").substring(0, 400));
        return { Rows: [] };
    }
    function getParamStr() {
        return '[{"name":"@StartDate","type":"varchar","size":"100","value":"' + $("#txtStartTime").val() + '"}'
             + ',{"name":"@EndDate","type":"varchar","size":"100","value":"' + $("#txtEndTime").val() + '"}'
             + ',{"name":"@Source","type":"varchar","size":"20","value":"' + $("#selSource").val() + '"}'
             + ',{"name":"@NCCode","type":"varchar","size":"50","value":"' + $("#txtNCCode").val() + '"}'
             + ',{"name":"@ItemCode","type":"varchar","size":"50","value":"' + $("#txtItemCode").val() + '"}'
             + ',{"name":"@MachineCode","type":"varchar","size":"50","value":"' + $("#txtMachineCode").val() + '"}]';
    }

    function runQuery() {
        $("#divLoading").hide().remove();
        $("#ReportList").replaceWith("<div id='ReportList'></div>");
        $("#ReportList").SktMesGrid({
            columns: [
                { display: '日期', name: '日期', align: 'center', width: 90, minWidth: 60 },
                { display: '来源', name: '来源', align: 'center', width: 90, minWidth: 60 },
                { display: '不良代码', name: '不良代码', align: 'center', width: 90, minWidth: 60 },
                { display: '不良描述', name: '不良描述', align: 'left', width: 110, minWidth: 60 },
                { display: '产品料号', name: '产品料号', align: 'center', width: 100, minWidth: 60 },
                { display: '产品名称', name: '产品名称', align: 'left', width: 170, minWidth: 60 },
                { display: '机台', name: '机台', align: 'left', width: 120, minWidth: 60 },
                { display: '数量', name: '数量', align: 'right', width: 90, minWidth: 60 },
                { display: '记录数', name: '记录数', align: 'right', width: 80, minWidth: 60 }
            ],
            width: '100%',
            height: '99%',
            dataAction: 'PROC',
            dataSource: biSpName,
            paramters: getParamStr(),
            pageSize: 50,
            isProcPage: true
        });
        var ds = biFetchRows();
        buildChart(ds && ds.Rows ? ds.Rows : []);
        showChart();
    }

    $("#bnView").click(function () { runQuery(); });

    $("#bnImport").click(function () {
        $("#hdnPararms").val("@StartDate,@EndDate,@Source,@NCCode,@ItemCode,@MachineCode");
        $("#hdnPararmValue").val($("#txtStartTime").val() + "," + $("#txtEndTime").val() + "," + $("#selSource").val() + "," + $("#txtNCCode").val() + "," + $("#txtItemCode").val() + "," + $("#txtMachineCode").val());
        $("#hdnOperation").val(biSpName);
        $("#hdnFileName").val('P95 不良与报废登记分析');
        document.forms[0].submit();
    });

    function buildChart(rows) {
        var codeMap = {}, codes = [], daySrc = {}, days = [], srcs = [];
        var i;
        for (i = 0; i < rows.length; i++) {
            var r = rows[i];
            var code = (r['不良代码'] || '') + ' ' + (r['不良描述'] || '');
            var d = r['日期'];
            var s = r['来源'] || '全部';
            codeMap[code] = (codeMap[code] || 0) + num(r['数量']);
            if (codes.indexOf(code) < 0) { codes.push(code); }
            if (!daySrc[d]) { daySrc[d] = {}; days.push(d); }
            daySrc[d][s] = (daySrc[d][s] || 0) + num(r['数量']);
            if (srcs.indexOf(s) < 0) { srcs.push(s); }
        }
        codes.sort(function (x, y) { return codeMap[y] - codeMap[x]; });
        days.sort();
        srcs.sort();
        var topC = codes.slice(0, 10), topV = [], cum = 0, total = 0, cumArr = [];
        for (i = 0; i < codes.length; i++) { total += codeMap[codes[i]]; }
        for (i = 0; i < topC.length; i++) { topV.push(codeMap[topC[i]]); }
        for (i = 0; i < topC.length; i++) {
            cum += codeMap[topC[i]];
            cumArr.push(total > 0 ? Math.round(10000 * cum / total) / 100 : 0);
        }
        var srcSeries = srcs.map(function (s) {
            var arr = [], j;
            for (j = 0; j < days.length; j++) { arr.push(daySrc[days[j]][s] || 0); }
            return { name: s, type: 'bar', stack: 'd', data: arr };
        });
        biChart.optA = {
            title: { text: '不良/报废代码TOP10与累计占比', left: 'center' },
            tooltip: { trigger: 'axis' },
            legend: { data: ['数量', '累计%'], top: 28 },
            grid: { left: 60, right: 60, top: 70, bottom: 100 },
            xAxis: { type: 'category', data: topC, axisLabel: { rotate: 40, interval: 0 } },
            yAxis: [
                { type: 'value', name: '数量' },
                { type: 'value', name: '%', max: 100, splitLine: { show: false } }
            ],
            series: [
                { name: '数量', type: 'bar', data: topV },
                { name: '累计%', type: 'line', yAxisIndex: 1, data: cumArr, label: { show: true, formatter: '{c}%' } }
            ]
        };
        biChart.optB = {
            title: { text: '每日不良/报废趋势', left: 'center' },
            tooltip: { trigger: 'axis' },
            legend: { data: srcs, top: 28 },
            grid: { left: 60, right: 40, top: 70, bottom: 40 },
            xAxis: { type: 'category', data: days },
            yAxis: { type: 'value', name: '数量' },
            series: srcSeries
        };
    }

    function showChart() {
        if (!biChart.optA || !biChart.optB) { return; }
        var el = document.getElementById('ChartA');
        if (!el || el.offsetWidth === 0) { return; }
        if (!biChart.a) {
            biChart.a = echarts.init(el);
            biChart.b = echarts.init(document.getElementById('ChartB'));
        }
        biChart.a.setOption(biChart.optA, true);
        biChart.b.setOption(biChart.optB, true);
    }
</script>
