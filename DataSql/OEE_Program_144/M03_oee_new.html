    function biFetchRows(spName, paramStr) {
        var tries = [true, false], k;
        for (k = 0; k < tries.length; k++) {
            var isProc = tries[k];
            biFetchRows.ok = false;
            biFetchRows.data = null;
            biFetchRows.msg = "";
            var req = {
                type: "post",
                url: "../Handler/ReportingServer.ashx?gridviewname=" + spName + "&rnd=" + Math.random(),
                data: { dataAction: "PROC", paramters: paramStr },
                dataType: "json",
                async: false,
                success: function (data) {
                    biFetchRows.ok = true;
                    biFetchRows.data = data;
                },
                error: function (xhr) {
                    biFetchRows.ok = false;
                    biFetchRows.msg = (xhr && xhr.status ? xhr.status + " " : "")
                        + (xhr && xhr.responseText ? xhr.responseText : "");
                }
            };
            if (isProc) {
                req.data.isProcPage = "true";
                req.data.page = "-1";
                req.data.pagesize = "-1";
                req.data.conditions = "1=1";
            }
            $.ajax(req);
            if (biFetchRows.ok && biFetchRows.data && typeof biFetchRows.data === "object") {
                return biFetchRows.data;
            }
        }
        alert("Get Data Error: " + (biFetchRows.msg || "no response").substring(0, 400));
        return { Rows: [] };
    }

    function buildCharts() {
        var dsA = biFetchRows(statusSpName, statusParamStr());
        var rowsA = dsA && dsA.Rows ? dsA.Rows : [];
        var dsB = biFetchRows(oeeSpName, mainParamStr());
        var rowsB = dsB && dsB.Rows ? dsB.Rows : [];
        buildChartA(rowsA);
        buildChartB(rowsB);
        chartsDirty = false;
        chartsVisited = true;
        showChart();
    }

    function buildChartA(rows) {
        var cats = [], day = [], night = [], i;
        for (i = 0; i < rows.length; i++) {
            cats.push(String(rows[i]['状态'] || ''));
            day.push(num(rows[i]['白班小时']));
            night.push(num(rows[i]['晚班小时']));
        }
        biChart.optA = {
            title: { text: '管理状态不同时长统计(小时)', left: 'center' },
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: { data: ['白班', '晚班'], top: 28 },
            grid: { left: 70, right: 30, top: 70, bottom: 120 },
            xAxis: { type: 'category', data: cats, axisLabel: { rotate: 40, interval: 0 } },
            yAxis: { type: 'value', name: '小时' },
            series: [
                { name: '白班', type: 'bar', stack: 's', data: day },
                { name: '晚班', type: 'bar', stack: 's', data: night }
            ]
        };
    }

    function buildChartB(rows) {
        var dayMap = {}, days = [], eqMap = {}, eqs = [], i, r, d, e;
        for (i = 0; i < rows.length; i++) {
            r = rows[i];
            d = String(r['日期'] || '');
            e = String(r['设备编码'] || '');
            if (!d || !e) { continue; }
            if (!dayMap[d]) { dayMap[d] = {}; days.push(d); }
            if (eqMap[e] === undefined) { eqMap[e] = 0; eqs.push(e); }
            dayMap[d][e] = (dayMap[d][e] || 0) + num(r['良品数']);
            eqMap[e] += num(r['良品数']);
        }
        days.sort();
        eqs.sort(function (x, y) { return eqMap[y] - eqMap[x]; });
        var topEq = eqs.slice(0, 8), series = [], m, j, arr;
        for (m = 0; m < topEq.length; m++) {
            arr = [];
            for (j = 0; j < days.length; j++) { arr.push(dayMap[days[j]][topEq[m]] || 0); }
            series.push({ name: topEq[m], type: 'line', smooth: true, data: arr });
        }
        biChart.optB = {
            title: { text: '各机台每日良品产量趋势(TOP8)', left: 'center' },
            tooltip: { trigger: 'axis' },
            legend: { data: topEq, top: 28 },
            grid: { left: 60, right: 30, top: 70, bottom: 40 },
            xAxis: { type: 'category', data: days },
            yAxis: { type: 'value', name: '良品数' },
            series: series
        };
    }

    function showChart() {
        if (!biChart.optA || !biChart.optB) { return; }
        var el = document.getElementById('ChartA');
        if (!el || el.offsetWidth === 0) { return; }
        if (!biChart.a) {
            biChart.a = echarts.init(el);
            biChart.b = echarts.init(document.getElementById('ChartB'));
        }
        biChart.a.setOption(biChart.optA, true);
        biChart.b.setOption(biChart.optB, true);
    }
</script>
